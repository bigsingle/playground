<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Physics Lab Oscilloscope</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background-color: #1e1e1e;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .app-title {
      font-size: 1.1rem;
      margin-bottom: 8px;
      color: #00ffcc;
      text-align: center;
    }

    .oscillo-container {
      position: relative;
      width: 95vw;
      max-width: 850px;
      height: 70vh;
      max-height: 480px;
      background-color: #050b05;
      border: 3px solid #444;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 20px rgba(0,0,0,0.8);
    }

    .screen-area {
      position: relative;
      flex: 1;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .overlay-controls {
      position: absolute;
      top: 10px;
      left: 10px;
      display: flex;
      gap: 10px;
      z-index: 10;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      background: rgba(0, 0, 0, 0.65);
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid #00ffcc;
    }

    .control-label {
      font-size: 0.65rem;
      color: #aaa;
      margin-bottom: 2px;
    }

    select {
      background: #111;
      color: #00ffcc;
      border: 1px solid #00ffcc;
      border-radius: 3px;
      font-size: 0.85rem;
      font-family: monospace;
      padding: 2px 4px;
      outline: none;
      cursor: pointer;
    }

    .status-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: rgba(255, 255, 255, 0.7);
      font-size: 1.1rem;
      font-family: monospace;
      pointer-events: none;
      background: rgba(0, 0, 0, 0.6);
      padding: 10px 20px;
      border-radius: 6px;
      border: 1px solid #555;
      text-align: center;
    }

    .bottom-bar {
      height: 48px;
      background-color: #2a2a2a;
      border-top: 1px solid #444;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
    }

    .btn {
      padding: 6px 16px;
      background-color: #00ffcc;
      color: #000;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .btn.active {
      background-color: #ff4444;
      color: #fff;
    }

    .info-text {
      font-size: 0.75rem;
      color: #ccc;
      font-family: monospace;
    }
  </style>
</head>
<body>

  <div class="app-title">高校物理 Webオシロスコープ (AGC: OFF)</div>

  <div class="oscillo-container">
    <div class="screen-area" id="screenArea">
      <canvas id="oscilloCanvas"></canvas>
      
      <div class="overlay-controls">
        <div class="control-group">
          <span class="control-label">時間軸 (Time/DIV)</span>
          <select id="timeSelect">
            <option value="1">1 ms/div</option>
            <option value="2">2 ms/div</option>
            <option value="5" selected>5 ms/div</option>
            <option value="10">10 ms/div</option>
            <option value="20">20 ms/div</option>
          </select>
        </div>

        <div class="control-group">
          <span class="control-label">電圧軸 (Volt/DIV)</span>
          <select id="voltSelect">
            <option value="5">5 mV/div</option>
            <option value="10" selected>10 mV/div</option>
            <option value="20">20 mV/div</option>
            <option value="50">50 mV/div</option>
            <option value="100">100 mV/div</option>
          </select>
        </div>
      </div>

      <div class="status-overlay" id="statusOverlay">
        画面下部の「測定開始」ボタンを押してください
      </div>
    </div>

    <div class="bottom-bar">
      <button class="btn" id="toggleBtn">測定開始</button>
      <div class="info-text" id="infoText">状態: 停止中</div>
    </div>
  </div>

<script>
  const canvas = document.getElementById('oscilloCanvas');
  const ctx = canvas.getContext('2d');
  const toggleBtn = document.getElementById('toggleBtn');
  const statusOverlay = document.getElementById('statusOverlay');
  const infoText = document.getElementById('infoText');
  const timeSelect = document.getElementById('timeSelect');
  const voltSelect = document.getElementById('voltSelect');

  let audioCtx = null;
  let analyser = null;
  let dataArray = null;
  let isRunning = false;

  function resizeCanvas() {
    canvas.width = canvas.clientWidth * window.devicePixelRatio;
    canvas.height = canvas.clientHeight * window.devicePixelRatio;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  toggleBtn.addEventListener('click', async () => {
    if (!audioCtx) {
      try {
        // 入力電圧の大きさを正しく比較するため、各種自動処理をオフに設定
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: false, // エコーキャンセル OFF
            noiseSuppression: false, // ノイズキャンセラー OFF
            autoGainControl: false   // 自動利得制御(AGC) OFF
          }
        });

        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioCtx.createMediaStreamSource(stream);

        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 4096; // 充分なサンプル数を確保

        source.connect(analyser);
        dataArray = new Uint8Array(analyser.fftSize);

        isRunning = true;
        toggleBtn.innerText = "一時停止";
        toggleBtn.classList.add('active');
        statusOverlay.style.display = 'none';
        infoText.innerText = "状態: 計測中 (AGC: OFF)";
        draw();
      } catch (err) {
        alert("マイク（音声入力）のアクセス許可が必要です: " + err);
      }
    } else if (audioCtx.state === 'running') {
      await audioCtx.suspend();
      isRunning = false;
      toggleBtn.innerText = "測定再開";
      toggleBtn.classList.remove('active');
      statusOverlay.style.display = 'block';
      statusOverlay.innerText = "一時停止中";
      infoText.innerText = "状態: 一時停止中";
    } else {
      await audioCtx.resume();
      isRunning = true;
      toggleBtn.innerText = "一時停止";
      toggleBtn.classList.add('active');
      statusOverlay.style.display = 'none';
      infoText.innerText = "状態: 計測中 (AGC: OFF)";
      draw();
    }
  });

  function draw() {
    if (!isRunning) return;
    requestAnimationFrame(draw);

    const w = canvas.width;
    const h = canvas.height;

    // 背景クリア
    ctx.fillStyle = '#050b05';
    ctx.fillRect(0, 0, w, h);

    // グリッド描画 (10 DIV x 8 DIV)
    ctx.strokeStyle = '#1a331a';
    ctx.lineWidth = 1 * window.devicePixelRatio;
    const cols = 10;
    const rows = 8;

    for (let i = 1; i < cols; i++) {
      const x = (w / cols) * i;
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
    }
    for (let j = 1; j < rows; j++) {
      const y = (h / rows) * j;
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
    }

    // センター軸
    ctx.strokeStyle = '#2d5e2d';
    ctx.beginPath(); ctx.moveTo(w / 2, 0); ctx.lineTo(w / 2, h); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, h / 2); ctx.lineTo(w, h / 2); ctx.stroke();

    // 波形データ取得 (Time Domain)
    analyser.getByteTimeDomainData(dataArray);

    const timeDivMs = parseFloat(timeSelect.value);
    const voltDivMv = parseFloat(voltSelect.value);

    // 時間軸スパン計算
    const totalDisplayTimeMs = timeDivMs * cols;
    const sampleRate = audioCtx.sampleRate;
    const samplesToDisplay = Math.floor((totalDisplayTimeMs / 1000) * sampleRate);

    // 電圧スケール計算 (手動で感度を切り替え可能)
    // 基準感度の換算係数
    const scaleFactor = (10 / voltDivMv);

    ctx.lineWidth = 2 * window.devicePixelRatio;
    ctx.strokeStyle = '#00ffcc';
    ctx.beginPath();

    const sliceWidth = w / samplesToDisplay;
    let x = 0;

    for (let i = 0; i < samplesToDisplay; i++) {
      if (i >= dataArray.length) break;

      // 8bitデータ (0~255, 128がゼロクロス) を -1.0 ~ +1.0 に正規化
      const v = (dataArray[i] - 128) / 128.0;
      
      // 手動スケール調整を適用
      const scaledV = v * scaleFactor;
      
      // Y座標変換 (中央が0V)
      const y = (h / 2) - (scaledV * (h / 2));

      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);

      x += sliceWidth;
    }
    ctx.stroke();
  }
</script>
</body>
</html>
