<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LCR Realtime Measuring Tool (Cross-Correlation)</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent-red: #ef4444;
      --accent-blue: #38bdf8;
      --accent-green: #22c55e;
      --border-color: #334155;
    }

    body {
      margin: 0;
      padding: 16px;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: system-ui, -apple-system, sans-serif;
    }

    h1 {
      font-size: 1.25rem;
      margin: 0 0 16px 0;
      text-align: center;
      color: var(--accent-blue);
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      align-items: center;
    }

    label {
      font-size: 0.875rem;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    input[type="range"] {
      width: 100%;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      background: #475569;
      cursor: not-allowed;
    }

    .canvas-container {
      position: relative;
      width: 100%;
      height: 240px;
    }

    canvas {
      width: 100%;
      height: 100%;
      background: #000;
      border-radius: 6px;
      display: block;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
      margin-top: 12px;
    }

    .metric-box {
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 10px;
      text-align: center;
    }

    .metric-title {
      font-size: 0.75rem;
      color: #94a3b8;
    }

    .metric-value {
      font-size: 1.125rem;
      font-weight: bold;
      margin-top: 4px;
    }

    .legend {
      display: flex;
      justify-content: center;
      gap: 16px;
      font-size: 0.85rem;
      margin-bottom: 8px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>LCR リアルタイム計測 (相互相関アルゴリズム)</h1>

  <!-- コントロール部 -->
  <div class="card controls">
    <button id="startBtn">計測開始 (Audio Start)</button>
    <label>
      発振周波数 $f$: <span id="freqVal">1000</span> Hz
      <input type="range" id="freqSlider" min="100" max="5000" step="10" value="1000">
    </label>
    <label>
      基準抵抗 $R_{ref}$: <span id="rRefVal">100</span> Ω
      <input type="number" id="rRefInput" value="100" min="1" style="padding: 4px; border-radius: 4px; border: 1px solid #475569; background: #0f172a; color: white;">
    </label>
  </div>

  <!-- オシロスコープ表示 -->
  <div class="card">
    <div class="legend">
      <div class="legend-item"><span class="dot" style="background: var(--accent-red);"></span> 基準信号 $v(t)$ [赤]</div>
      <div class="legend-item"><span class="dot" style="background: var(--accent-blue);"></span> マイク入力 $i(t)$ [水色]</div>
    </div>
    <div class="canvas-container">
      <canvas id="scopeCanvas"></canvas>
    </div>
  </div>

  <!-- 数値算出結果 -->
  <div class="card">
    <div class="metrics-grid">
      <div class="metric-box">
        <div class="metric-title">位相差 $\phi$</div>
        <div class="metric-value" style="color: #facc15;" id="phaseVal">0.0°</div>
      </div>
      <div class="metric-box">
        <div class="metric-title">振幅比 (Mic/Ref)</div>
        <div class="metric-value" id="ampVal">0.000</div>
      </div>
      <div class="metric-box">
        <div class="metric-title">インピーダンス $|Z|$</div>
        <div class="metric-value" style="color: var(--accent-green);" id="zVal">0.0 Ω</div>
      </div>
      <div class="metric-box">
        <div class="metric-title">リアクタンス $X$</div>
        <div class="metric-value" id="xVal">0.0 Ω</div>
      </div>
    </div>
  </div>
</div>

<script>
  let audioCtx = null;
  let oscNode = null;
  let analyserNode = null;
  let isMeasuring = false;

  const startBtn = document.getElementById('startBtn');
  const freqSlider = document.getElementById('freqSlider');
  const freqVal = document.getElementById('freqVal');
  const rRefInput = document.getElementById('rRefInput');
  const rRefVal = document.getElementById('rRefVal');

  const canvas = document.getElementById('scopeCanvas');
  const ctx = canvas.getContext('2d');

  // キャンバスリサイズ対応
  function resizeCanvas() {
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  freqSlider.addEventListener('input', (e) => {
    const f = parseFloat(e.target.value);
    freqVal.textContent = f;
    if (oscNode) oscNode.frequency.setTargetAtTime(f, audioCtx.currentTime, 0.01);
  });

  rRefInput.addEventListener('change', (e) => {
    rRefVal.textContent = e.target.value;
  });

  // オーディオ処理の初期化
  startBtn.addEventListener('click', async () => {
    if (isMeasuring) return;

    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    await audioCtx.resume();

    // 信号発生器 (Oscillator)
    oscNode = audioCtx.createOscillator();
    oscNode.type = 'sine';
    oscNode.frequency.setValueAtTime(parseFloat(freqSlider.value), audioCtx.currentTime);

    const masterGain = audioCtx.createGain();
    masterGain.gain.setValueAtTime(0.5, audioCtx.currentTime);

    oscNode.connect(masterGain);
    masterGain.connect(audioCtx.destination); // イヤホンジャック／スピーカー出力
    oscNode.start();

    // マイク入力取得
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
      });
      const micSource = audioCtx.createMediaStreamSource(stream);
      analyserNode = audioCtx.createAnalyser();
      analyserNode.fftSize = 2048; // 相互相関精度向上用のバッファサイズ
      micSource.connect(analyserNode);

      isMeasuring = true;
      startBtn.disabled = true;
      startBtn.textContent = "計測中...";

      requestAnimationFrame(processAudio);
    } catch (err) {
      alert("マイクアクセスの許可が必要です: " + err);
    }
  });

  // メインループ処理
  function processAudio() {
    if (!isMeasuring) return;

    const sampleRate = audioCtx.sampleRate;
    const bufferLength = analyserNode.fftSize;
    const timeData = new Float32Array(bufferLength);
    analyserNode.getFloatTimeDomainData(timeData);

    const targetFreq = parseFloat(freqSlider.value);
    const rRef = parseFloat(rRefInput.value);
    const currentTime = audioCtx.currentTime;

    // 1. マイク入力の振幅 (Peak-to-Peak) 算出
    let maxVal = -1, minVal = 1;
    for (let i = 0; i < bufferLength; i++) {
      if (timeData[i] > maxVal) maxVal = timeData[i];
      if (timeData[i] < minVal) minVal = timeData[i];
    }
    const micAmp = (maxVal - minVal) / 2;

    // 2. 基準信号 v(t) 配列の生成
    const refSignal = new Float32Array(bufferLength);
    for (let i = 0; i < bufferLength; i++) {
      const t = currentTime - (bufferLength - i) / sampleRate;
      refSignal[i] = Math.sin(2 * Math.PI * targetFreq * t);
    }

    // 3. 相互相関関数による Lag（遅れ）探索
    const periodSamples = Math.round(sampleRate / targetFreq);
    const maxLag = Math.floor(periodSamples / 2);

    let maxCorrelation = -Infinity;
    let bestLag = 0;

    for (let tau = -maxLag; tau <= maxLag; tau++) {
      let correlation = 0;
      let count = 0;

      for (let i = maxLag; i < bufferLength - maxLag; i++) {
        correlation += refSignal[i] * timeData[i + tau];
        count++;
      }

      if (count > 0) correlation /= count;

      if (correlation > maxCorrelation) {
        maxCorrelation = correlation;
        bestLag = tau;
      }
    }

    // 4. 位相差 [度] と回路パラメータ計算
    let phaseDiffDeg = -(bestLag / periodSamples) * 360;
    while (phaseDiffDeg > 180) phaseDiffDeg -= 360;
    while (phaseDiffDeg < -180) phaseDiffDeg += 360;

    const phaseRad = (phaseDiffDeg * Math.PI) / 180;
    
    // インピーダンス概算 (|Z| = R_ref * (RefAmp / MicAmp))
    // ※キャリブレーション用ゲイン調整項を含む
    const impedance = micAmp > 0.01 ? (rRef / micAmp) : 0;
    const reactance = impedance * Math.sin(phaseRad);

    // 5. UI（数値）の更新
    document.getElementById('phaseVal').textContent = phaseDiffDeg.toFixed(1) + "°";
    document.getElementById('ampVal').textContent = micAmp.toFixed(3);
    document.getElementById('zVal').textContent = impedance.toFixed(1) + " Ω";
    document.getElementById('xVal').textContent = reactance.toFixed(1) + " Ω";

    // 6. オシロスコープ波形描画
    drawOscilloscope(refSignal, timeData, targetFreq, sampleRate, periodSamples, bestLag);

    requestAnimationFrame(processAudio);
  }

  // 描画関数
  function drawOscilloscope(refSignal, timeData, targetFreq, sampleRate, periodSamples, bestLag) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // グリッド線の描画
    ctx.strokeStyle = '#1e293b';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, canvas.height / 2); ctx.lineTo(canvas.width, canvas.height / 2);
    ctx.moveTo(canvas.width / 2, 0); ctx.lineTo(canvas.width / 2, canvas.height);
    ctx.stroke();

    const displaySamples = Math.floor(periodSamples * 2); // 2周期分表示
    if (displaySamples >= refSignal.length) return;

    // トリガー位置の特定（基準信号のゼロクロス位置で同期）
    let triggerIndex = 0;
    for (let i = 0; i < refSignal.length - 1; i++) {
      if (refSignal[i] <= 0 && refSignal[i + 1] > 0) {
        triggerIndex = i;
        break;
      }
    }

    // 1. 基準波形 v(t) 描画（赤）
    ctx.strokeStyle = '#ef4444';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i < displaySamples; i++) {
      const idx = triggerIndex + i;
      if (idx >= refSignal.length) break;
      const x = (i / displaySamples) * canvas.width;
      const y = (canvas.height / 2) - (refSignal[idx] * (canvas.height / 3));
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();

    // 2. マイク波形 i(t) 描画（水色）
    ctx.strokeStyle = '#38bdf8';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i < displaySamples; i++) {
      const idx = triggerIndex + i;
      if (idx >= timeData.length) break;
      const x = (i / displaySamples) * canvas.width;
      const y = (canvas.height / 2) - (timeData[idx] * (canvas.height / 3));
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
</script>
</body>
</html>
