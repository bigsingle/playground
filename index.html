<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マイク入力認識テスト</title>
    <style>
        body { font-family: sans-serif; background: #222; color: #fff; padding: 20px; text-align: center; }
        .box { background: #333; padding: 15px; margin: 10px auto; max-width: 500px; border-radius: 8px; }
        .status { font-weight: bold; font-size: 1.2em; color: #00ffcc; }
        meter { width: 80%; height: 25px; }
        button { font-size: 16px; padding: 10px 20px; background: #0288d1; color: white; border: none; border-radius: 4px; }
    </style>
</head>
<body>

    <h2>iPad 外部マイク認識チェッカー</h2>
    
    <div class="box">
        <button id="startBtn">マイク入力を確認</button>
        <p>使用中のデバイス: <br><span id="devName" class="status">未取得</span></p>
        <p>入力レベル:</p>
        <meter id="levelMeter" min="0" max="100" value="0"></meter>
    </div>

    <script>
        const startBtn = document.getElementById('startBtn');
        const devName = document.getElementById('devName');
        const levelMeter = document.getElementById('levelMeter');

        startBtn.addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
                });

                // 使用中のマイクデバイス名を取得
                const track = stream.getAudioTracks()[0];
                const settings = track.getSettings();
                const devices = await navigator.mediaDevices.enumerateDevices();
                const currentDev = devices.find(d => d.deviceId === settings.deviceId);

                devName.textContent = currentDev ? currentDev.label : "マイク取得完了 (名前不明)";

                // 簡易レベルメーター表示
                const audioCtx = new AudioContext();
                const source = audioCtx.createMediaStreamSource(stream);
                const analyser = audioCtx.createAnalyser();
                analyser.fftSize = 256;
                source.connect(analyser);

                const dataArray = new Uint8Array(analyser.frequencyBinCount);
                
                function update() {
                    analyser.getByteFrequencyData(dataArray);
                    let sum = 0;
                    for(let i = 0; i < dataArray.length; i++) sum += dataArray[i];
                    let avg = sum / dataArray.length;
                    levelMeter.value = (avg / 255) * 100;
                    requestAnimationFrame(update);
                }
                update();

            } catch (err) {
                alert("マイクエラー: " + err.message);
            }
        });
    </script>
</body>
</html>
