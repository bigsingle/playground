<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LC電気振動オシロスコープ</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #121212; color: #fff; margin: 0; padding: 10px; }
        canvas { background: #000; border: 2px solid #333; border-radius: 8px; width: 100%; max-width: 800px; height: 350px; }
        .controls { margin: 15px 0; }
        button { font-size: 16px; padding: 10px 20px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 5px; }
        button:disabled { background: #555; }
        .info { font-size: 14px; color: #aaa; }
    </style>
</head>
<body>

    <h2>LC電気振動 簡易オシロスコープ</h2>
    <canvas id="oscilloscope"></canvas>
    
    <div class="controls">
        <button id="startBtn">計測開始 / リセット</button>
        <button id="freezeBtn" disabled>画面固定 (Hold)</button>
    </div>
    <div class="info">※ スイッチ操作時の過渡応答波形をトリガーキャプチャします</div>

<script>
let audioCtx, analyser, dataArray;
let isFrozen = false;
const canvas = document.getElementById('oscilloscope');
const canvasCtx = canvas.getContext('2d');
const startBtn = document.getElementById('startBtn');
const freezeBtn = document.getElementById('freezeBtn');

startBtn.addEventListener('click', async () => {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
        const source = audioCtx.createMediaStreamSource(stream);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 2048;
        source.connect(analyser);
        dataArray = new Float32Array(analyser.fftSize);
        freezeBtn.disabled = false;
        draw();
    } else if (audioCtx.state === 'suspended') {
        await audioCtx.resume();
    }
    isFrozen = false;
});

freezeBtn.addEventListener('click', () => {
    isFrozen = !isFrozen;
    freezeBtn.innerText = isFrozen ? "解除 (Run)" : "画面固定 (Hold)";
});

function draw() {
    requestAnimationFrame(draw);
    if (isFrozen || !analyser) return;

    analyser.getFloatTimeDomainData(dataArray);

    canvasCtx.fillStyle = '#000';
    canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

    // グリッド線の描画
    canvasCtx.strokeStyle = '#222';
    canvasCtx.lineWidth = 1;
    for(let x = 0; x < canvas.width; x += 50) { canvasCtx.beginPath(); canvasCtx.moveTo(x, 0); canvasCtx.lineTo(x, canvas.height); canvasCtx.stroke(); }
    for(let y = 0; y < canvas.height; y += 50) { canvasCtx.beginPath(); canvasCtx.moveTo(0, y); canvasCtx.lineTo(canvas.width, y); canvasCtx.stroke(); }

    // 簡易トリガー検出（ゼロクロス）
    let triggerIndex = 0;
    for (let i = 0; i < dataArray.length - 1; i++) {
        if (dataArray[i] < 0 && dataArray[i+1] >= 0) {
            triggerIndex = i;
            break;
        }
    }

    // 波形描画
    canvasCtx.lineWidth = 2;
    canvasCtx.strokeStyle = '#00ffcc';
    canvasCtx.beginPath();

    const sliceWidth = canvas.width * 1.0 / (dataArray.length - triggerIndex);
    let x = 0;

    for (let i = triggerIndex; i < dataArray.length; i++) {
        const v = dataArray[i];
        const y = (1 - v) * canvas.height / 2; // スケーリング

        if (i === triggerIndex) {
            canvasCtx.moveTo(x, y);
        } else {
            canvasCtx.lineTo(x, y);
        }
        x += sliceWidth;
    }

    canvasCtx.stroke();
}
</script>
</body>
</html>
