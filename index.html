
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NE555 周波数測定テスト</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: #f2f4f7; color: #17202a;
  }
  main { max-width: 680px; margin: auto; }
  h1 { font-size: 1.35rem; }
  .panel {
    background: white; border-radius: 14px;
    padding: 16px; margin: 14px 0;
    box-shadow: 0 2px 8px #0000000d;
  }
  .value {
    font-size: clamp(2.2rem, 10vw, 3.5rem);
    font-weight: 700; text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .unit { text-align: center; color: #52616b; }
  button {
    border: 0; border-radius: 10px; padding: 13px 18px;
    font-size: 1rem; font-weight: 600; cursor: pointer;
    background: #1266d6; color: white;
  }
  button:disabled { opacity: .45; }
  .buttons { display: flex; gap: 10px; flex-wrap: wrap; }
  canvas {
    width: 100%; height: 160px;
    background: #101820; border-radius: 8px;
    display: block;
  }
  #status { line-height: 1.6; overflow-wrap: anywhere; }
  .small { font-size: .85rem; color: #52616b; }
</style>
</head>
<body>
<main>
  <h1>NE555 周波数測定テスト</h1>

  <section class="panel">
    <div class="unit">検出周波数</div>
    <div class="value" id="freq">---.-</div>
    <div class="unit">Hz</div>
    <p id="level" class="unit">入力振幅：---</p>
  </section>

  <section class="panel">
    <div class="buttons">
      <button id="start">測定開始</button>
      <button id="stop" disabled>停止</button>
    </div>
    <p id="status">接続を確認してから測定を開始してください。</p>
    <p class="small">
      周波数はマイク入力の波形から推定します。
      この段階では電圧を表示しません。
    </p>
  </section>

  <section class="panel">
    <h2 style="font-size:1rem">入力波形</h2>
    <canvas id="wave" width="640" height="240"></canvas>
    <p id="info" class="small">サンプリング周波数：---</p>
  </section>
</main>

<script>
"use strict";

const $ = id => document.getElementById(id);
const canvas = $("wave");
const ctx = canvas.getContext("2d");

let audioContext = null;
let stream = null;
let source = null;
let processor = null;
let silentGain = null;
let running = false;
let sampleCount = 0;
let lastCrossing = null;
let crossings = [];
let displayFrequency = null;

function drawWave(data) {
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);
  ctx.strokeStyle = "#34495e";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, h / 2);
  ctx.lineTo(w, h / 2);
  ctx.stroke();

  ctx.strokeStyle = "#35d0ba";
  ctx.lineWidth = 2;
  ctx.beginPath();

  const step = Math.max(1, Math.floor(data.length / w));
  for (let x = 0; x < w; x++) {
    const i = Math.min(data.length - 1, x * step);
    const y = h / 2 - data[i] * h * 0.42;
    if (x === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.stroke();
}

function processAudio(event) {
  if (!running) return;

  const data = event.inputBuffer.getChannelData(0);
  let min = Infinity, max = -Infinity;

  for (let i = 0; i < data.length; i++) {
    if (data[i] < min) min = data[i];
    if (data[i] > max) max = data[i];
  }

  const peakToPeak = max - min;
  $("level").textContent =
    "入力振幅（正規化）： " + peakToPeak.toFixed(3);

  drawWave(data);

  // 信号が小さすぎる場合は周波数を計算しない
  if (peakToPeak < 0.015) {
    $("status").textContent =
      "信号が小さいか、入力が届いていません。";
    sampleCount += data.length;
    return;
  }

  // 各ブロックの最小値・最大値の中間をしきい値とする
  const threshold = (min + max) / 2;
  const found = [];

  for (let i = 1; i < data.length; i++) {
    if (data[i - 1] < threshold &&
        data[i] >= threshold) {
      const dy = data[i] - data[i - 1];
      const fraction = dy !== 0
        ? (threshold - data[i - 1]) / dy : 0;

      found.push(sampleCount + i - 1 + fraction);
    }
  }

  for (const crossing of found) {
    if (lastCrossing !== null) {
      const periodSamples = crossing - lastCrossing;
      const hz = audioContext.sampleRate / periodSamples;

      // 想定する555の発振帯域だけを採用
      if (hz >= 100 && hz <= 6000) {
        crossings.push({ sample: crossing, hz });
      }
    }
    lastCrossing = crossing;
  }

  // 直近の周期を複数まとめて平均する
  const now = sampleCount + data.length;
  crossings = crossings.filter(
    c => now - c.sample < audioContext.sampleRate * 0.8
  );

  if (crossings.length >= 3) {
    const first = crossings[0].sample;
    const last = crossings[crossings.length - 1].sample;
    const cycles = crossings.length;
    const hz = audioContext.sampleRate * (cycles - 1) / (last - first);

    if (Number.isFinite(hz) && hz >= 100 && hz <= 6000) {
      displayFrequency = hz;
      $("freq").textContent = hz.toFixed(1);
      $("status").textContent = "周波数を検出しています。";
    }
  }

  sampleCount += data.length;
}

async function startMeasurement() {
  if (running) return;

  try {
    $("status").textContent = "マイク入力を準備しています…";

    stream = await navigator.mediaDevices.getUserMedia({
      audio: {
        channelCount: { ideal: 1 },
        echoCancellation: false,
        noiseSuppression: false,
        autoGainControl: false
      },
      video: false
    });

    audioContext = new AudioContext();
    await audioContext.resume();

    source = audioContext.createMediaStreamSource(stream);
    processor = audioContext.createScriptProcessor(4096, 1, 1);
    silentGain = audioContext.createGain();
    silentGain.gain.value = 0;

    processor.onaudioprocess = processAudio;

    source.connect(processor);
    processor.connect(silentGain);
    silentGain.connect(audioContext.destination);

    running = true;
    sampleCount = 0;
    lastCrossing = null;
    crossings = [];
    displayFrequency = null;

    $("freq").textContent = "---.-";
    $("start").disabled = true;
    $("stop").disabled = false;
    $("info").textContent =
      "サンプリング周波数：" +
      audioContext.sampleRate.toLocaleString() + " Hz";

    $("status").textContent =
      "入力を取得中です。555の発振回路を接続してください。";

  } catch (error) {
    stopMeasurement();
    $("status").textContent =
      "入力を開始できませんでした：" + error.message +
      "。HTTPS、マイク許可、変換アダプターを確認してください。";
  }
}

function stopMeasurement() {
  running = false;

  if (processor) {
    processor.onaudioprocess = null;
    processor.disconnect();
    processor = null;
  }
  if (source) {
    source.disconnect();
    source = null;
  }
  if (silentGain) {
    silentGain.disconnect();
    silentGain = null;
  }
  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }
  if (audioContext) {
    audioContext.close();
    audioContext = null;
  }

  $("start").disabled = false;
  $("stop").disabled = true;
}

$("start").addEventListener("click", startMeasurement);
$("stop").addEventListener("click", stopMeasurement);

window.addEventListener("pagehide", stopMeasurement);
</script>
</body>
</html>
