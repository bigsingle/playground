<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Oscilloscope</title>
  <!-- 共通デザインCSSの読み込み -->
  <link rel="stylesheet" href="CommonStyle_CSS.css">
  <style>
    /* 共通CSSに不足しているオシロスコープ固有のレイアウト・調整スタイル */
    .oscillo-main-card {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .oscillo-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
      justify-content: space-between;
    }
    .oscillo-controls-inline {
      display: flex;
      gap: 1rem;
      align-items: center;
      flex-wrap: wrap;
    }
    select {
      background: var(--bg-card);
      color: var(--text-main);
      border: 2px solid var(--border-color);
      border-radius: var(--radius-sm);
      font-family: var(--font-mono);
      font-size: 0.9rem;
      padding: 0.4rem 0.8rem;
      outline: none;
      cursor: pointer;
    }
    select:focus {
      border-color: var(--border-color-focus);
    }
    .agc-toggle-btn {
      font-family: var(--font-family);
      font-weight: 700;
      font-size: 0.8rem;
      padding: 0.4rem 0.8rem;
      border-radius: var(--radius-sm);
      border: 2px solid var(--border-color);
      background-color: var(--bg-control);
      color: var(--text-main);
      cursor: pointer;
      transition: background-color 0.2s, border-color 0.2s;
    }
    .agc-toggle-btn.active {
      background-color: var(--accent-success);
      color: var(--text-inverse);
      border-color: var(--accent-success);
    }
    .oscillo-canvas-box {
      position: relative;
      width: 100%;
      height: 60vh;
      min-height: 350px;
      background-color: var(--canvas-bg);
      border: 2px solid var(--border-color);
      border-radius: var(--radius-sm);
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <header class="sim-header">
    <h1 style="font-size: 1.25rem; color: var(--accent-primary);">Oscilloscope</h1>
    <span class="sim-badge" id="statusBadge">状態: 停止中</span>
  </header>

  <main class="sim-container">
    <div class="sim-card oscillo-main-card">
      
      <!-- ツールバー（操作パネル） -->
      <div class="oscillo-toolbar">
        <div class="oscillo-controls-inline">
          <div class="sim-control-group" style="padding: 0.5rem 0.8rem;">
            <span class="sim-label" style="font-size: 0.75rem; margin-bottom: 2px;">時間軸 (Time/DIV)</span>
            <select id="timeSelect">
              <option value="1">1 ms/div</option>
              <option value="2">2 ms/div</option>
              <option value="5" selected>5 ms/div</option>
              <option value="10">10 ms/div</option>
              <option value="20">20 ms/div</option>
            </select>
          </div>

          <div class="sim-control-group" style="padding: 0.5rem 0.8rem;">
            <span class="sim-label" style="font-size: 0.75rem; margin-bottom: 2px;">電圧軸 (Volt/DIV)</span>
            <div style="display: flex; gap: 8px; align-items: center;">
              <select id="voltSelect">
                <option value="5">5 mV/div</option>
                <option value="10" selected>10 mV/div</option>
                <option value="20">20 mV/div</option>
                <option value="50">50 mV/div</option>
                <option value="100">100 mV/div</option>
              </select>
              <button class="agc-toggle-btn" id="agcBtn">AGC: OFF</button>
            </div>
          </div>
        </div>

        <div>
          <button class="sim-btn sim-btn-primary" id="toggleBtn">測定開始</button>
        </div>
      </div>

      <!-- オシロスコープ描画スクリーン -->
      <div class="oscillo-canvas-box">
        <canvas id="oscilloCanvas"></canvas>
      </div>

    </div>
  </main>

<script>
  const canvas = document.getElementById('oscilloCanvas');
  const ctx = canvas.getContext('2d');
  const toggleBtn = document.getElementById('toggleBtn');
  const statusBadge = document.getElementById('statusBadge');
  const timeSelect = document.getElementById('timeSelect');
  const voltSelect = document.getElementById('voltSelect');
  const agcBtn = document.getElementById('agcBtn');

  let audioCtx = null;
  let analyser = null;
  let dataArray = null;
  let isRunning = false;
  let isAgcOn = false;
  let mediaStream = null;

  function resizeCanvas() {
    canvas.width = canvas.clientWidth * window.devicePixelRatio;
    canvas.height = canvas.clientHeight * window.devicePixelRatio;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  async function startAudioStream() {
    if (mediaStream) {
      mediaStream.getTracks().forEach(track => track.stop());
    }

    mediaStream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: false,
        noiseSuppression: false,
        autoGainControl: isAgcOn
      }
    });

    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } else if (audioCtx.state === 'suspended') {
      await audioCtx.resume();
    }

    const source = audioCtx.createMediaStreamSource(mediaStream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 4096;

    source.connect(analyser);
    dataArray = new Uint8Array(analyser.fftSize);
  }

  agcBtn.addEventListener('click', async () => {
    isAgcOn = !isAgcOn;
    if (isAgcOn) {
      agcBtn.innerText = "AGC: ON";
      agcBtn.classList.add('active');
    } else {
      agcBtn.innerText = "AGC: OFF";
      agcBtn.classList.remove('active');
    }

    if (isRunning) {
      await startAudioStream();
      statusBadge.innerText = `状態: 計測中 (AGC: ${isAgcOn ? 'ON' : 'OFF'})`;
    }
  });

  toggleBtn.addEventListener('click', async () => {
    if (!audioCtx) {
      try {
        await startAudioStream();
        isRunning = true;
        toggleBtn.innerText = "一時停止";
        toggleBtn.classList.remove('sim-btn-primary');
        toggleBtn.classList.add('sim-btn-outline');
        statusBadge.innerText = `状態: 計測中 (AGC: ${isAgcOn ? 'ON' : 'OFF'})`;
        draw();
      } catch (err) {
        alert("マイク（音声入力）のアクセス許可が必要です: " + err);
      }
    } else if (audioCtx.state === 'running') {
      await audioCtx.suspend();
      isRunning = false;
      toggleBtn.innerText = "測定再開";
      toggleBtn.classList.remove('sim-btn-outline');
      toggleBtn.classList.add('sim-btn-primary');
      statusBadge.innerText = "状態: 一時停止中";
    } else {
      await audioCtx.resume();
      isRunning = true;
      toggleBtn.innerText = "一時停止";
      toggleBtn.classList.remove('sim-btn-primary');
      toggleBtn.classList.add('sim-btn-outline');
      statusBadge.innerText = `状態: 計測中 (AGC: ${isAgcOn ? 'ON' : 'OFF'})`;
      draw();
    }
  });

  function draw() {
    if (!isRunning) return;
    requestAnimationFrame(draw);

    const w = canvas.width;
    const h = canvas.height;

    // 背景クリア (CUD準拠の明るい/ダークトーンキャンバス背景)
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, w, h);

    // グリッド描画 (10 DIV x 8 DIV)
    ctx.strokeStyle = '#e2e8f0';
    ctx.lineWidth = 1 * window.devicePixelRatio;
    const cols = 10;
    const rows = 8;

    for (let i = 1; i < cols; i++) {
      const x = (w / cols) * i;
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
    }
    for (let j = 1; j < rows; j++) {
      const y = (h / rows) * j;
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
    }

    // センター軸
    ctx.strokeStyle = '#cbd5e1';
    ctx.beginPath(); ctx.moveTo(w / 2, 0); ctx.lineTo(w / 2, h); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, h / 2); ctx.lineTo(w, h / 2); ctx.stroke();

    // 波形データ取得 (Time Domain)
    analyser.getByteTimeDomainData(dataArray);

    const timeDivMs = parseFloat(timeSelect.value);
    const voltDivMv = parseFloat(voltSelect.value);

    // 時間軸スパン計算
    const totalDisplayTimeMs = timeDivMs * cols;
    const sampleRate = audioCtx.sampleRate;
    const samplesToDisplay = Math.floor((totalDisplayTimeMs / 1000) * sampleRate);

    // 電圧スケール計算
    const scaleFactor = (10 / voltDivMv);

    ctx.lineWidth = 2 * window.devicePixelRatio;
    ctx.strokeStyle = '#0284c7'; // CUDアクセントカラー
    ctx.beginPath();

    const sliceWidth = w / samplesToDisplay;
    let x = 0;

    for (let i = 0; i < samplesToDisplay; i++) {
      if (i >= dataArray.length) break;

      const v = (dataArray[i] - 128) / 128.0;
      const scaledV = v * scaleFactor;
      const y = (h / 2) - (scaledV * (h / 2));

      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);

      x += sliceWidth;
    }
    ctx.stroke();
  }
</script>
</body>
</html>
