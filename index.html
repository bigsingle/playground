<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>周波数ジェネレーター & オシロスコープ</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #0b0d10;
      color: #e0e6ed;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: #12161c;
      border: 1px solid #222933;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
    }

    /* ヘッダー・メイン周波数表示 */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .freq-display-box {
      display: flex;
      align-items: center;
      background: #080a0c;
      border: 1px solid #00f0ff;
      border-radius: 8px;
      padding: 4px 12px;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
    }

    .freq-label {
      font-size: 14px;
      color: #8a99ad;
      margin-right: 8px;
    }

    .freq-input {
      background: transparent;
      border: none;
      color: #ffffff;
      font-size: 24px;
      font-weight: bold;
      width: 110px;
      text-align: right;
      outline: none;
      font-family: 'Courier New', Courier, monospace;
    }

    .freq-unit {
      color: #00f0ff;
      font-size: 16px;
      margin-left: 6px;
      font-weight: bold;
    }

    .channel-selector {
      display: flex;
      gap: 4px;
      background: #080a0c;
      padding: 3px;
      border-radius: 6px;
      border: 1px solid #222933;
    }

    .ch-btn {
      background: transparent;
      border: none;
      color: #627284;
      padding: 4px 8px;
      font-size: 12px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .ch-btn.active {
      background: #222933;
      color: #00f0ff;
    }

    /* コントロールエリア */
    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .play-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #1e2630;
      border: 2px solid #00f0ff;
      color: #00f0ff;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.3);
      transition: all 0.2s;
    }

    .play-btn:active {
      transform: scale(0.95);
    }

    .play-btn.playing {
      background: #00f0ff;
      color: #0c1015;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.6);
    }

    .play-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .waveform-selector {
      display: flex;
      gap: 8px;
    }

    .wave-btn {
      width: 44px;
      height: 44px;
      background: #181f28;
      border: 1px solid #2c3645;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .wave-btn svg {
      width: 24px;
      height: 24px;
      stroke: #627284;
      fill: none;
      stroke-width: 2;
    }

    .wave-btn.active {
      border-color: #00f0ff;
      background: #122530;
    }

    .wave-btn.active svg {
      stroke: #00f0ff;
    }

    /* スライダー */
    .section-title {
      font-size: 12px;
      color: #8a99ad;
      text-align: center;
      margin-bottom: 4px;
    }

    .slider-container {
      margin-bottom: 12px;
    }

    .slider-labels {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #00f0ff;
      margin-top: 2px;
    }

    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      background: transparent;
    }

    input[type=range]:focus {
      outline: none;
    }

    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 6px;
      cursor: pointer;
      background: #18202a;
      border-radius: 3px;
      border: 1px solid #283342;
    }

    input[type=range]::-webkit-slider-thumb {
      height: 20px;
      width: 20px;
      border-radius: 50%;
      background: #00f0ff;
      cursor: pointer;
      -webkit-appearance: none;
      margin-top: -8px;
      box-shadow: 0 0 8px rgba(0, 240, 255, 0.8);
    }

    /* 微調整ボタン */
    .fine-tune-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 4px;
      margin-bottom: 12px;
    }

    .tune-btn {
      background: #18202a;
      border: 1px solid #00f0ff44;
      color: #00f0ff;
      border-radius: 12px;
      padding: 6px 0;
      font-size: 10px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }

    .tune-btn:active {
      background: #00f0ff;
      color: #000;
    }

    /* プリセットボタン */
    .preset-container {
      margin-bottom: 12px;
    }

    .preset-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 4px;
      margin-top: 4px;
    }

    .preset-btn {
      background: #161c24;
      border: 1px solid #283342;
      color: #8a99ad;
      border-radius: 12px;
      padding: 6px 0;
      font-size: 10px;
      cursor: pointer;
      text-align: center;
    }

    .preset-btn:active {
      border-color: #00f0ff;
      color: #00f0ff;
    }

    /* オシロスコープ (Canvas) */
    .scope-container {
      position: relative;
      background: #050709;
      border: 1px solid #1c2633;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    canvas {
      display: block;
      width: 100%;
      height: 140px;
    }

    .scope-info {
      position: absolute;
      top: 6px;
      left: 10px;
      font-size: 10px;
      color: #ff4a4a;
      font-family: monospace;
      pointer-events: none;
    }

    /* 時間軸設定 */
    .div-controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .div-label {
      font-size: 11px;
      color: #8a99ad;
    }

    .time-btn-group {
      display: flex;
      background: #080a0c;
      border: 1px solid #00f0ff66;
      border-radius: 6px;
      padding: 2px;
    }

    .time-btn {
      background: transparent;
      border: none;
      color: #8a99ad;
      padding: 4px 8px;
      font-size: 10px;
      cursor: pointer;
      border-radius: 4px;
    }

    .time-btn.active {
      background: #00f0ff22;
      color: #00f0ff;
    }

    /* 音量バー */
    .volume-container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .volume-slider {
      width: 80%;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- ヘッダー / 周波数表示 & チャンネル -->
  <div class="top-bar">
    <div class="freq-display-box">
      <span class="freq-label">周波数</span>
      <input type="number" id="freqInput" class="freq-input" value="440" step="any" min="1" max="20000">
      <span class="freq-unit">Hz</span>
    </div>
    <div class="channel-selector">
      <button class="ch-btn active" data-ch="LR">L+R</button>
      <button class="ch-btn" data-ch="L">L</button>
      <button class="ch-btn" data-ch="R">R</button>
    </div>
  </div>

  <!-- 再生ボタン & 波形選択 -->
  <div class="controls-row">
    <button id="playBtn" class="play-btn" title="再生/停止">
      <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <svg id="pauseIcon" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
    </button>

    <div class="waveform-selector">
      <!-- サイン波 -->
      <button class="wave-btn active" data-wave="sine" title="サイン波">
        <svg viewBox="0 0 24 24"><path d="M2 12 Q 6 4, 10 12 T 18 12 T 22 12"/></svg>
      </button>
      <!-- 矩形波 -->
      <button class="wave-btn" data-wave="square" title="矩形波">
        <svg viewBox="0 0 24 24"><path d="M2 17 V 7 H 12 V 17 H 22"/></svg>
      </button>
      <!-- 三角波 -->
      <button class="wave-btn" data-wave="triangle" title="三角波">
        <svg viewBox="0 0 24 24"><path d="M2 17 L 7 7 L 17 17 L 22 7"/></svg>
      </button>
      <!-- ノコギリ波 -->
      <button class="wave-btn" data-wave="sawtooth" title="ノコギリ波">
        <svg viewBox="0 0 24 24"><path d="M2 17 L 12 7 V 17 L 22 7"/></svg>
      </button>
    </div>
  </div>

  <!-- 周波数メインスライダー -->
  <div class="slider-container">
    <div class="section-title">周波数設定</div>
    <input type="range" id="freqSlider" min="0" max="1" step="0.0001" value="0.447">
    <div class="slider-labels">
      <span>20 Hz</span>
      <span>20 kHz</span>
    </div>
  </div>

  <!-- 微調整ボタン -->
  <div class="section-title">微調整 (Hz)</div>
  <div class="fine-tune-grid">
    <button class="tune-btn" data-val="-100">-100</button>
    <button class="tune-btn" data-val="-10">-10</button>
    <button class="tune-btn" data-val="-1">-1</button>
    <button class="tune-btn" data-val="-0.1">-0.1</button>
    <button class="tune-btn" data-val="0.1">+0.1</button>
    <button class="tune-btn" data-val="1">+1</button>
    <button class="tune-btn" data-val="10">+10</button>
    <button class="tune-btn" data-val="100">+100</button>
  </div>

  <!-- プリセット -->
  <div class="preset-container">
    <div class="section-title">プリセット (Hz)</div>
    <div class="preset-grid">
      <button class="preset-btn" data-freq="1">1.0</button>
      <button class="preset-btn" data-freq="20">20.0</button>
      <button class="preset-btn" data-freq="50">50.0</button>
      <button class="preset-btn" data-freq="100">100</button>
      <button class="preset-btn" data-freq="200">200</button>
      <button class="preset-btn" data-freq="500">500</button>
      <button class="preset-btn" data-freq="1000">1.0k</button>
      <button class="preset-btn" data-freq="2000">2.0k</button>
      <button class="preset-btn" data-freq="4000">4.0k</button>
      <button class="preset-btn" data-freq="6400">6.4k</button>
      <button class="preset-btn" data-freq="8000">8.0k</button>
      <button class="preset-btn" data-freq="10000">10k</button>
      <button class="preset-btn" data-freq="16000">16k</button>
      <button class="preset-btn" data-freq="18000">18k</button>
      <button class="preset-btn" data-freq="19000">19k</button>
      <button class="preset-btn" data-freq="20000">20k</button>
    </div>
  </div>

  <!-- オシロスコープ Canvas -->
  <div class="scope-container">
    <div class="scope-info" id="scopeInfo">T = 1/f = --ms, f = --Hz</div>
    <canvas id="scopeCanvas"></canvas>
  </div>

  <!-- 時間軸 (Time/DIV) -->
  <div class="div-controls">
    <span class="div-label">時間/DIV</span>
    <div class="time-btn-group">
      <button class="time-btn" data-time="0.0005">500µs</button>
      <button class="time-btn active" data-time="0.001">1ms</button>
      <button class="time-btn" data-time="0.002">2ms</button>
      <button class="time-btn" data-time="auto">AUTO</button>
    </div>
  </div>

  <!-- システム音量 -->
  <div class="volume-container">
    <div class="section-title">システム音量</div>
    <input type="range" id="volSlider" class="volume-slider" min="0" max="1" step="0.01" value="0.3">
  </div>
</div>

<script>
  // Web Audio Context & Nodes
  let audioCtx = null;
  let oscillator = null;
  let gainNode = null;
  let mergerNode = null;
  let analyserNode = null;

  // App State
  let isPlaying = false;
  let currentFreq = 440;
  let currentWave = 'sine';
  let currentChannel = 'LR'; // LR, L, R
  let currentVolume = 0.3;
  let timePerDiv = 0.001; // 1ms
  let autoTimeDiv = true;

  // DOM Elements
  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');
  const pauseIcon = document.getElementById('pauseIcon');
  const freqInput = document.getElementById('freqInput');
  const freqSlider = document.getElementById('freqSlider');
  const volSlider = document.getElementById('volSlider');
  const scopeCanvas = document.getElementById('scopeCanvas');
  const canvasCtx = scopeCanvas.getContext('2d');
  const scopeInfo = document.getElementById('scopeInfo');

  // 対数スライダー変換 (20Hz - 20000Hz)
  const MIN_FREQ = 20;
  const MAX_FREQ = 20000;
  const logMin = Math.log(MIN_FREQ);
  const logMax = Math.log(MAX_FREQ);

  function freqToSlider(f) {
    const clamped = Math.max(MIN_FREQ, Math.min(MAX_FREQ, f));
    return (Math.log(clamped) - logMin) / (logMax - logMin);
  }

  function sliderToFreq(val) {
    return Math.exp(logMin + val * (logMax - logMin));
  }

  // Web Audio 初期化
  function initAudio() {
    if (audioCtx) return;

    const AudioContext = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AudioContext();

    oscillator = audioCtx.createOscillator();
    gainNode = audioCtx.createGain();
    analyserNode = audioCtx.createAnalyser();
    mergerNode = audioCtx.createChannelMerger(2);

    analyserNode.fftSize = 2048; // トリガー検出精度のために2048に設定

    oscillator.type = currentWave;
    oscillator.frequency.setValueAtTime(currentFreq, audioCtx.currentTime);
    gainNode.gain.setValueAtTime(0, audioCtx.currentTime); // 初期ミュート

    // チャンネル分岐接続
    oscillator.connect(gainNode);
    gainNode.connect(analyserNode);

    updateChannelRouting();
    oscillator.start();
  }

  function updateChannelRouting() {
    if (!audioCtx) return;
    analyserNode.disconnect();
    mergerNode.disconnect();

    if (currentChannel === 'LR') {
      analyserNode.connect(audioCtx.destination);
    } else if (currentChannel === 'L') {
      analyserNode.connect(mergerNode, 0, 0); // Lのみ
      mergerNode.connect(audioCtx.destination);
    } else if (currentChannel === 'R') {
      analyserNode.connect(mergerNode, 0, 1); // Rのみ
      mergerNode.connect(audioCtx.destination);
    }
  }

  // 周波数更新
  function setFrequency(freq, updateSlider = true, updateInput = true) {
    currentFreq = Math.max(0.1, Math.min(20000, freq));
    if (oscillator && audioCtx) {
      oscillator.frequency.setValueAtTime(currentFreq, audioCtx.currentTime);
    }
    if (updateInput) freqInput.value = currentFreq < 10 ? currentFreq.toFixed(1) : Math.round(currentFreq * 10) / 10;
    if (updateSlider) freqSlider.value = freqToSlider(currentFreq);
  }

  // 再生/停止 トグル
  playBtn.addEventListener('click', () => {
    initAudio();
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }

    isPlaying = !isPlaying;
    if (isPlaying) {
      gainNode.gain.setTargetAtTime(currentVolume, audioCtx.currentTime, 0.01);
      playBtn.classList.add('playing');
      playIcon.style.display = 'none';
      pauseIcon.style.display = 'block';
    } else {
      gainNode.gain.setTargetAtTime(0, audioCtx.currentTime, 0.01);
      playBtn.classList.remove('playing');
      playIcon.style.display = 'block';
      pauseIcon.style.display = 'none';
    }
  });

  // 波形切り替え
  document.querySelectorAll('.wave-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.wave-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentWave = btn.dataset.wave;
      if (oscillator) oscillator.type = currentWave;
    });
  });

  // チャンネル切り替え
  document.querySelectorAll('.ch-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.ch-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentChannel = btn.dataset.ch;
      updateChannelRouting();
    });
  });

  // スライダー＆数値入力連動
  freqSlider.addEventListener('input', (e) => {
    setFrequency(sliderToFreq(parseFloat(e.target.value)), false, true);
  });

  freqInput.addEventListener('change', (e) => {
    const val = parseFloat(e.target.value);
    if (!isNaN(val)) setFrequency(val, true, false);
  });

  // 微調整ボタン
  document.querySelectorAll('.tune-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const delta = parseFloat(btn.dataset.val);
      setFrequency(currentFreq + delta);
    });
  });

  // プリセットボタン
  document.querySelectorAll('.preset-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      setFrequency(parseFloat(btn.dataset.freq));
    });
  });

  // 時間軸ボタン
  document.querySelectorAll('.time-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      if (btn.dataset.time === 'auto') {
        autoTimeDiv = true;
      } else {
        autoTimeDiv = false;
        timePerDiv = parseFloat(btn.dataset.time);
      }
    });
  });

  // 音量スライダー
  volSlider.addEventListener('input', (e) => {
    currentVolume = parseFloat(e.target.value);
    if (gainNode && isPlaying) {
      gainNode.gain.setValueAtTime(currentVolume, audioCtx.currentTime);
    }
  });

  // -------------------------------------------------------------
  // Canvas オシロスコープ描画 (ゼロクロス・トリガー検知付き)
  // -------------------------------------------------------------
  function resizeCanvas() {
    scopeCanvas.width = scopeCanvas.clientWidth;
    scopeCanvas.height = scopeCanvas.clientHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  function drawScope() {
    requestAnimationFrame(drawScope);

    const width = scopeCanvas.width;
    const height = scopeCanvas.height;

    // 背景描画
    canvasCtx.fillStyle = '#050709';
    canvasCtx.fillRect(0, 0, width, height);

    // グリッド線 (グリッド数: 横10, 縦4)
    canvasCtx.strokeStyle = '#121a24';
    canvasCtx.lineWidth = 1;

    const gridX = 10;
    const gridY = 4;
    for (let i = 1; i < gridX; i++) {
      const x = (width / gridX) * i;
      canvasCtx.beginPath();
      canvasCtx.moveTo(x, 0);
      canvasCtx.lineTo(x, height);
      canvasCtx.stroke();
    }
    for (let j = 1; j < gridY; j++) {
      const y = (height / gridY) * j;
      canvasCtx.beginPath();
      canvasCtx.moveTo(0, y);
      canvasCtx.lineTo(width, y);
      canvasCtx.stroke();
    }

    // 周期計算表示 (T = 1/f)
    const periodMs = (1 / currentFreq) * 1000;
    let pStr = periodMs < 1 ? `${(periodMs * 1000).toFixed(1)}µs` : `${periodMs.toFixed(2)}ms`;
    let fStr = currentFreq >= 1000 ? `${(currentFreq / 1000).toFixed(2)}kHz` : `${currentFreq.toFixed(1)}Hz`;
    scopeInfo.innerText = `T = 1/f = ${pStr}, f = ${fStr}`;

    // 波形描画
    if (analyserNode && isPlaying) {
      const bufferLength = analyserNode.fftSize;
      const dataArray = new Uint8Array(bufferLength);
      analyserNode.getByteTimeDomainData(dataArray);

      // 【★ここが改善ポイント：ゼロクロス・トリガー検知★】
      // 波形が下（128未満）から上（128以上）に切り替わる最初のポイントを探す
      let triggerOffset = 0;
      for (let i = 0; i < bufferLength / 2; i++) {
        if (dataArray[i] < 128 && dataArray[i + 1] >= 128) {
          triggerOffset = i;
          break;
        }
      }

      // 時間軸スケール計算
      if (autoTimeDiv) {
        // 画面内に2〜3周期収まるように自動計算
        timePerDiv = Math.max(0.0001, (3 / currentFreq) / 10);
      }

      const sampleRate = audioCtx.sampleRate;
      const totalDisplayTime = timePerDiv * 10; // 10 DIV分
      const samplesToDisplay = totalDisplayTime * sampleRate;
      const sampleStep = samplesToDisplay / width;

      canvasCtx.strokeStyle = '#00f0ff';
      canvasCtx.lineWidth = 2;
      canvasCtx.beginPath();

      for (let x = 0; x < width; x++) {
        // トリガー開始位置からのインデックス計算
        const sampleIndex = triggerOffset + Math.floor(x * sampleStep);

        if (sampleIndex >= bufferLength) break;

        const v = dataArray[sampleIndex] / 128.0; // 0.0 ~ 2.0
        const y = (v * height) / 2;

        if (x === 0) {
          canvasCtx.moveTo(x, y);
        } else {
          canvasCtx.lineTo(x, y);
        }
      }
      canvasCtx.stroke();
    } else {
      // 停止中は中央直線
      canvasCtx.strokeStyle = '#00f0ff44';
      canvasCtx.lineWidth = 1;
      canvasCtx.beginPath();
      canvasCtx.moveTo(0, height / 2);
      canvasCtx.lineTo(width, height / 2);
      canvasCtx.stroke();
    }
  }

  drawScope();
</script>
</body>
</html>
