<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スマホ簡易電圧計（光起電力測定用）</title>
  <style>
    body { font-family: sans-serif; text-align: center; background: #f0f4f8; padding: 20px; }
    .card { background: white; max-width: 500px; margin: 0 auto; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    button { font-size: 1.2rem; padding: 10px 20px; border: none; border-radius: 6px; background: #007bff; color: white; cursor: pointer; }
    button:disabled { background: #ccc; }
    #meter { font-size: 3rem; font-weight: bold; color: #2d3748; margin: 20px 0; }
    canvas { width: 100%; height: 150px; background: #222; border-radius: 6px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>LED光起電力 測定アプリ</h2>
    <p>TRRSマイク端子からの信号レベルを計測します</p>
    <button id="startBtn">計測開始</button>
    
    <div id="meter">0.00 mV</div>
    <canvas id="waveform"></canvas>
  </div>

  <script>
    let audioCtx, analyser, dataArray, canvas, canvasCtx;
    const startBtn = document.getElementById('startBtn');
    const meter = document.getElementById('meter');

    startBtn.addEventListener('click', async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioCtx.createMediaStreamSource(stream);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 2048;
        source.connect(analyser);

        dataArray = new Uint8Array(analyser.frequencyBinCount);
        canvas = document.getElementById('waveform');
        canvasCtx = canvas.getContext('2d');

        startBtn.disabled = true;
        startBtn.innerText = "計測中...";
        draw();
      } catch (err) {
        alert("マイクへのアクセスが拒否されたか、デバイスが対応していません: " + err);
      }
    });

    function draw() {
      requestAnimationFrame(draw);
      analyser.getByteTimeDomainData(dataArray);

      // 振幅の最大値（Peak-to-Peak）を計算し、簡易電圧スケールに変換
      let maxVal = 0;
      let minVal = 255;
      for (let i = 0; i < dataArray.length; i++) {
        if (dataArray[i] > maxVal) maxVal = dataArray[i];
        if (dataArray[i] < minVal) minVal = dataArray[i];
      }
      
      // 8bit（0〜255、中心128）からの偏差を電圧（相対値mV）として換算
      const amplitude = (maxVal - minVal) / 255.0; 
      const estimatedmV = (amplitude * 1000).toFixed(1); // 簡易校正値

      meter.innerText = `${estimatedmV} mV`;

      // 波形描画
      canvasCtx.fillStyle = '#222';
      canvasCtx.fillRect(0, 0, canvas.width, canvas.height);
      canvasCtx.lineWidth = 2;
      canvasCtx.strokeStyle = '#00ffcc';
      canvasCtx.beginPath();

      const sliceWidth = canvas.width * 1.0 / dataArray.length;
      let x = 0;
      for (let i = 0; i < dataArray.length; i++) {
        const v = dataArray[i] / 128.0;
        const y = v * canvas.height / 2;
        if (i === 0) canvasCtx.moveTo(x, y);
        else canvasCtx.lineTo(x, y);
        x += sliceWidth;
      }
      canvasCtx.stroke();
    }
  </script>
</body>
</html>
