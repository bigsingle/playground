<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>スペクトルアナライザー</title>
<style>
:root{color-scheme:dark;--bg:#061014;--panel:#091a20;--line:#15515a;--grid:#17434a;--text:#d7f1f2;--muted:#8cb6bc;--green:#00ff72;--cyan:#35e7df;--yellow:#ffe34a;--red:#ff5f83}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#0b2229 0,#04090d 70%);color:var(--text);font-family:Consolas,"Yu Gothic UI",Meiryo,monospace}
header{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:12px 18px;border:1px solid #173a42;background:#071318;box-shadow:0 0 18px #00d9cc16}
.brand{font-size:clamp(19px,2vw,28px);font-weight:800;letter-spacing:.04em;color:#26e4ad;margin-right:auto}
.brand span{color:#7af9ee}
button,select{font:inherit;color:var(--text);background:#13252d;border:1px solid #4b6b76;border-radius:7px;padding:9px 12px}
button{cursor:pointer}button:hover{border-color:var(--cyan)}button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:#064e32;border-color:#00e66a;color:#eafff1;font-weight:bold}
button.stop{background:#17262e}
.control{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
select{min-width:115px}
main{display:grid;grid-template-columns:1fr;gap:12px;padding:14px}
.panel{background:linear-gradient(145deg,#07171c,#061116);border:1px solid var(--line);border-radius:8px;box-shadow:inset 0 0 20px #00f0d005;min-width:0}
.panel h2{font-size:17px;color:var(--cyan);font-weight:700;margin:0;padding:12px 15px;border-bottom:1px solid #123d44}
.chart-wrap{padding:8px 10px 12px;position:relative}
canvas{display:block;width:100%;height:100%;cursor:pointer}
#spectrum{height:420px}#wave{height:280px}
.left{display:grid;gap:12px;align-content:start}
.status{display:inline-flex;align-items:center;gap:8px;padding:9px 12px;border:1px solid #1c6d4c;background:#09261c;border-radius:7px;color:#79ffb1;font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;background:#00ff72;box-shadow:0 0 8px #00ff72}
footer{color:#76969d;font-size:11px;padding:0 16px 16px}
@media(max-width:850px){#spectrum{height:320px}#wave{height:230px}header{align-items:flex-start}.brand{width:100%}}
</style>
</head>
<body>
<header>
  <div class="brand">〰 <span>SPECTRUM</span> ANALYZER</div>
  <div class="status"><i class="dot"></i><span id="statusText">マイク未接続</span></div>
  <button id="startBtn" class="primary">▶ 開始</button><button id="stopBtn" class="stop" disabled>■ 停止</button>
  <label class="control">FFTサイズ
    <select id="fftSize"><option>2048</option><option selected>4096</option><option>8192</option><option>16384</option></select>
  </label>
  <label class="control">表示モード
    <select id="scaleMode"><option value="log">対数（Log）</option><option value="linear" selected>リニア（Linear）</option></select>
  </label>
  <button id="resetHold">最大値をリセット</button>
</header>

<!-- 非表示の設定項目保持用 -->
<div style="display:none">
  <input type="checkbox" id="holdToggle" checked>
  <select id="freqRange"><option value="20000" selected>20 Hz ～ 20 kHz</option></select>
  <select id="floor"><option value="-100" selected>−100 dB</option></select>
</div>

<main>
  <section class="left">
    <div class="panel">
      <h2>▮ 周波数スペクトル <span style="font-size:12px;color:#7aa8ad;font-weight:400"> / グラフ面タップで一時停止・再開</span></h2>
      <div class="chart-wrap"><canvas id="spectrum"></canvas></div>
    </div>
    <div class="panel">
      <h2>▮ 時間波形 <span style="font-size:12px;color:#7aa8ad;font-weight:400"> / Time Domain</span></h2>
      <div class="chart-wrap"><canvas id="wave"></canvas></div>
    </div>
  </section>
</main>
<footer>ブラウザー標準 Web Audio API 使用 ｜ レベル表示は相対値です。マイク・部屋・入力回路の特性に影響されます。</footer>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const specCanvas = $('spectrum'), waveCanvas =$('wave');
  const specCtx = specCanvas.getContext('2d'), waveCtx = waveCanvas.getContext('2d');
  let audioCtx = null, stream = null, source = null, analyser = null, raf = 0;
  let freqData = null, timeData = null, holdData = null;
  let latestSampleRate = 44100;
  const colors = ['#ffe34a','#00ff72','#35e7df','#3298ff','#d34cff'];

  function resizeCanvas(canvas, ctx) {
    const dpr = window.devicePixelRatio || 1;
    const r = canvas.getBoundingClientRect();
    const w = Math.max(1, Math.round(r.width*dpr)), h = Math.max(1, Math.round(r.height*dpr));
    if(canvas.width!==w || canvas.height!==h){canvas.width=w;canvas.height=h;}
    ctx.setTransform(dpr,0,0,dpr,0,0);
    return {w:r.width,h:r.height};
  }
  function grid(ctx, w, h, m, xTicks, yTicks, xLabel, yLabel, yFormat) {
    ctx.clearRect(0,0,w,h); ctx.fillStyle='#041015';ctx.fillRect(0,0,w,h);
    ctx.font='12px Consolas, monospace';ctx.lineWidth=1;
    yTicks.forEach(v=>{
      const y=m.t+(1-(v-yTicks[0])/(yTicks[yTicks.length-1]-yTicks[0]))*(h-m.t-m.b);
      ctx.strokeStyle='#17434a';ctx.beginPath();ctx.moveTo(m.l,y);ctx.lineTo(w-m.r,y);ctx.stroke();
      ctx.fillStyle='#a9cbd0';ctx.textAlign='right';ctx.textBaseline='middle';ctx.fillText(yFormat(v),m.l-8,y);
    });
    xTicks.forEach(t=>{
      const x=t.x;
      ctx.strokeStyle='#10373d';ctx.beginPath();ctx.moveTo(x,m.t);ctx.lineTo(x,h-m.b);ctx.stroke();
      ctx.fillStyle='#a9cbd0';ctx.textAlign='center';ctx.textBaseline='top';ctx.fillText(t.label,x,h-m.b+8);
    });
    ctx.strokeStyle='#2c6a72';ctx.strokeRect(m.l,m.t,w-m.l-m.r,h-m.t-m.b);
    ctx.fillStyle='#b9e1e4';ctx.textAlign='center';ctx.textBaseline='bottom';ctx.fillText(xLabel,(m.l+w-m.r)/2,h-1);
    ctx.save();ctx.translate(15,(m.t+h-m.b)/2);ctx.rotate(-Math.PI/2);ctx.textAlign='center';ctx.textBaseline='top';ctx.fillText(yLabel,0,0);ctx.restore();
  }
  function freqToX(f, minF, maxF, m, w) {
    const mode=$('scaleMode').value;
    const a=mode==='log'?Math.log(minF):minF, b=mode==='log'?Math.log(maxF):maxF, v=mode==='log'?Math.log(Math.max(minF,f)):f;
    return m.l+(v-a)/(b-a)*(w-m.l-m.r);
  }
  function formatFreq(f){return f>=1000?(f/1000).toFixed(f>=10000?1:2)+' kHz':f.toFixed(1)+' Hz';}
  function getTicks(minF,maxF,m,w){
    const vals=$('scaleMode').value==='log'?[20,30,50,100,200,300,500,1000,2000,3000,5000,10000,20000]:[0,1000,2000,3000,4000,5000,10000,15000,20000];
    return vals.filter(v=>v>=minF&&v<=maxF).map(v=>({x:freqToX(v,minF,maxF,m,w),label:v>=1000?(v/1000)+'k':v}));
  }
  function drawSpectrum(){
    const {w,h}=resizeCanvas(specCanvas,specCtx),m={l:66,r:18,t:18,b:43};
    const minF=20,maxF=Number($('freqRange').value),floor=Number($('floor').value);
    const yTicks=[floor, floor*.75, floor*.5, floor*.25, 0].map(v=>Math.round(v));
    grid(specCtx,w,h,m,getTicks(minF,maxF,m,w),yTicks,'周波数 [Hz]','レベル [dB]',v=>v+'');
    if(!analyser||!freqData){specCtx.fillStyle='#51777d';specCtx.textAlign='center';specCtx.font='14px sans-serif';specCtx.fillText('「開始」を押してマイクを接続してください',w/2,h/2);return;}
    const nyquist=latestSampleRate/2, binHz=latestSampleRate/analyser.fftSize;
    const pts=[];
    for(let i=1;i<freqData.length;i++){
      const f=i*binHz;if(f<minF||f>Math.min(maxF,nyquist))continue;
      let db=freqData[i];db=Math.max(floor,Math.min(0,db));
      const x=freqToX(f,minF,maxF,m,w), y=m.t+(0-db)/(0-floor)*(h-m.t-m.b);
      pts.push({i,f,db,x,y});
    }
    if(pts.length){
      specCtx.beginPath();pts.forEach((p,j)=>j?specCtx.lineTo(p.x,p.y):specCtx.moveTo(p.x,p.y));
      specCtx.lineTo(pts[pts.length-1].x,h-m.b);specCtx.lineTo(pts[0].x,h-m.b);specCtx.closePath();
      const grad=specCtx.createLinearGradient(0,m.t,0,h-m.b);grad.addColorStop(0,'#00ff7230');grad.addColorStop(1,'#00ff7200');specCtx.fillStyle=grad;specCtx.fill();
      specCtx.beginPath();pts.forEach((p,j)=>j?specCtx.lineTo(p.x,p.y):specCtx.moveTo(p.x,p.y));specCtx.strokeStyle='#00ff72';specCtx.lineWidth=1.7;specCtx.shadowColor='#00ff72';specCtx.shadowBlur=5;specCtx.stroke();specCtx.shadowBlur=0;
      if($('holdToggle').checked&&holdData){
        specCtx.beginPath();let begun=false;
        pts.forEach(p=>{const db=Math.max(floor,Math.min(0,holdData[p.i]));const y=m.t+(0-db)/(0-floor)*(h-m.t-m.b);if(!begun){specCtx.moveTo(p.x,y);begun=true}else specCtx.lineTo(p.x,y);});
        specCtx.strokeStyle='#ffe34a';specCtx.lineWidth=1;specCtx.setLineDash([4,4]);specCtx.stroke();specCtx.setLineDash([]);
      }
      const peaks=findPeaks(freqData,binHz,minF,Math.min(maxF,nyquist),floor);
      peaks.forEach((p,i)=>{
        const x=freqToX(p.f,minF,maxF,m,w),y=m.t+(0-Math.max(floor,Math.min(0,p.db)))/(0-floor)*(h-m.t-m.b);
        specCtx.beginPath();specCtx.arc(x,y,4,0,Math.PI*2);specCtx.fillStyle=colors[i];specCtx.fill();
        
        // グラフ上にピーク情報を表示
        specCtx.fillStyle=colors[i];
        specCtx.font='11px Consolas, monospace';
        specCtx.textAlign='center';
        specCtx.textBaseline='bottom';
        specCtx.fillText(`${i+1}: ${formatFreq(p.f)} (${p.db.toFixed(1)}dB)`, x, y - 6);
      });
    }
  }
  function findPeaks(data,binHz,minF,maxF,floor){
    const peaks=[], minBin=Math.max(2,Math.ceil(minF/binHz)), maxBin=Math.min(data.length-2,Math.floor(maxF/binHz));
    for(let i=minBin;i<=maxBin;i++){
      if(data[i]>data[i-1]&&data[i]>=data[i+1]&&data[i]>floor+5){
        const f=i*binHz;
        if(peaks.every(p=>Math.abs(p.f-f)>Math.max(25,binHz*3)))peaks.push({f,db:data[i],i});
      }
    }
    return peaks.sort((a,b)=>b.db-a.db).slice(0,5);
  }
  function drawWave(){
    const {w,h}=resizeCanvas(waveCanvas,waveCtx),m={l:58,r:18,t:18,b:40};
    const yTicks=[-1,-.5,0,.5,1],xTicks=[0,1,2,3,4,5].map(v=>({x:m.l+v/5*(w-m.l-m.r),label:(v*4).toFixed(0)}));
    grid(waveCtx,w,h,m,xTicks,yTicks,'時間 [ms]','振幅',v=>v.toFixed(1));
    if(!analyser||!timeData){waveCtx.fillStyle='#51777d';waveCtx.textAlign='center';waveCtx.font='14px sans-serif';waveCtx.fillText('時間波形はここに表示されます',w/2,h/2);return;}
    const usable=w-m.l-m.r, top=m.t, bottom=h-m.b;
    waveCtx.beginPath();
    const step=Math.max(1,Math.floor(timeData.length/usable));
    let first=true;
    for(let x=0;x<usable;x++){
      const idx=Math.min(timeData.length-1,Math.floor(x/usable*timeData.length));
      const v=timeData[idx]/128-1,y=top+(1-v)/2*(bottom-top);
      if(first){waveCtx.moveTo(m.l+x,y);first=false}else waveCtx.lineTo(m.l+x,y);
    }
    waveCtx.strokeStyle='#00ff72';waveCtx.lineWidth=1.7;waveCtx.shadowColor='#00ff72';waveCtx.shadowBlur=4;waveCtx.stroke();waveCtx.shadowBlur=0;
  }
  function tick(){
    if(!analyser)return;
    analyser.getFloatFrequencyData(freqData);analyser.getByteTimeDomainData(timeData);
    if(holdData&&$('holdToggle').checked){for(let i=0;i<freqData.length;i++)holdData[i]=Math.max(holdData[i],freqData[i]);}
    drawSpectrum();drawWave();raf=requestAnimationFrame(tick);
  }
  async function start(){
    try{
      $('startBtn').disabled=true;$('statusText').textContent='接続中…';
      stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false},video:false});
      audioCtx=new (window.AudioContext||window.webkitAudioContext)();
      await audioCtx.resume();latestSampleRate=audioCtx.sampleRate;
      source=audioCtx.createMediaStreamSource(stream);analyser=audioCtx.createAnalyser();
      analyser.fftSize=Number($('fftSize').value);analyser.smoothingTimeConstant=.65;analyser.minDecibels=-120;analyser.maxDecibels=0;
      source.connect(analyser);
      freqData=new Float32Array(analyser.frequencyBinCount);timeData=new Uint8Array(analyser.fftSize);holdData=new Float32Array(analyser.frequencyBinCount);holdData.fill(-Infinity);
      $('statusText').textContent='マイク入力中';$('stopBtn').disabled=false;$('startBtn').textContent='● 接続中';
      tick();
    }catch(e){
      $('statusText').textContent='接続できません';$('startBtn').disabled=false;
      alert('マイクに接続できませんでした。ブラウザーのマイク使用許可と、HTTPSまたはlocalhostで開いていることを確認してください。\n\n'+e.message);
    }
  }
  async function stop(){
    cancelAnimationFrame(raf);raf=0;
    if(stream)stream.getTracks().forEach(t=>t.stop());
    if(audioCtx)await audioCtx.close();
    stream=null;audioCtx=null;source=null;analyser=null;freqData=null;timeData=null;holdData=null;
    $('statusText').textContent='マイク未接続';$('startBtn').disabled=false;$('startBtn').textContent='▶ 開始';$('stopBtn').disabled=true;
    drawSpectrum();drawWave();
  }
  
  // グラフ面タップで一時停止/再開
  async function togglePause() {
    if(!audioCtx) return;
    if(audioCtx.state === 'running') {
      await audioCtx.suspend();
      $('statusText').textContent = '一時停止中';
    } else if(audioCtx.state === 'suspended') {
      await audioCtx.resume();
      $('statusText').textContent = 'マイク入力中';
    }
  }

  specCanvas.addEventListener('click', togglePause);
  waveCanvas.addEventListener('click', togglePause);

  $('startBtn').addEventListener('click',start);$('stopBtn').addEventListener('click',stop);$('fftSize').addEventListener('change',()=>{
    if(analyser){analyser.fftSize=Number($('fftSize').value);freqData=new Float32Array(analyser.frequencyBinCount);timeData=new Uint8Array(analyser.fftSize);holdData=new Float32Array(analyser.frequencyBinCount);holdData.fill(-Infinity);}
    drawSpectrum();drawWave();
  });
  $('resetHold').addEventListener('click',()=>{if(holdData)holdData.fill(-Infinity);});$('scaleMode').addEventListener('change',()=>{drawSpectrum();});
  window.addEventListener('resize',()=>{drawSpectrum();drawWave();});
  drawSpectrum();drawWave();
})();
</script>
</body>
</html>
