<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LED光起電力 測定ツール（デバイス選択対応）</title>
  <style>
    body { font-family: sans-serif; text-align: center; background: #f4f7f6; padding: 20px; }
    .card { background: white; max-width: 480px; margin: 0 auto; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    select, button { font-size: 1rem; padding: 10px; margin: 8px 0; border-radius: 6px; border: 1px solid #ccc; width: 100%; }
    button { background: #007bff; color: white; border: none; font-weight: bold; cursor: pointer; }
    button:disabled { background: #aaa; }
    #stopBtn { background: #dc3545; }
    #meter { font-size: 2.5rem; font-weight: bold; margin: 15px 0; font-family: monospace; }
    canvas { width: 100%; height: 150px; background: #111; border-radius: 6px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>LED光起電力 測定ツール</h2>
    
    <!-- 入力デバイス選択ドロップダウン -->
    <label for="micSelect"><b>使用マイクの選択:</b></label>
    <select id="micSelect"><option value="">マイクを検索中...</option></select>

    <button id="startBtn">測定開始</button>
    <button id="stopBtn" disabled>測定中止</button>

    <div id="meter">0.0 mV</div>
    <canvas id="waveform"></canvas>
  </div>

  <script>
    let audioCtx = null;
    let analyser = null;
    let mediaStream = null;
    let animationId = null;

    const micSelect = document.getElementById('micSelect');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const meter = document.getElementById('meter');
    const canvas = document.getElementById('waveform');
    const canvasCtx = canvas.getContext('2d');

    // 起動時にマイクデバイス一覧を取得
    async function getMicDevices() {
      try {
        // 一度ダミーのstreamを取得してマイクパーミッションを得る
        const tmpStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        tmpStream.getTracks().forEach(t => t.stop());

        const devices = await navigator.mediaDevices.enumerateDevices();
        const audioInputs = devices.filter(d => d.kind === 'audioinput');
        
        micSelect.innerHTML = '';
        audioInputs.forEach((device, index) => {
          const option = document.createElement('option');
          option.value = device.deviceId;
          // 外付けマイク（Headset等）っぽい名前があれば強調
          const label = device.label || `マイク ${index + 1}`;
          option.text = label;
          if (label.toLowerCase().includes('headset') || label.toLowerCase().includes('external')) {
            option.selected = true;
          }
          micSelect.appendChild(option);
        });
      } catch (err) {
        micSelect.innerHTML = '<option value="">マイクの取得に失敗</option>';
      }
    }

    window.addEventListener('DOMContentLoaded', getMicDevices);

    // 測定開始
    startBtn.addEventListener('click', async () => {
      const selectedDeviceId = micSelect.value;
      
      const constraints = {
        audio: {
          deviceId: selectedDeviceId ? { exact: selectedDeviceId } : undefined,
          echoCancellation: false,
          noiseSuppression: false,
          autoGainControl: false
        }
      };

      try {
        mediaStream = await navigator.mediaDevices.getUserMedia(constraints);
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioCtx.createMediaStreamSource(mediaStream);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 2048;
        source.connect(analyser);

        startBtn.disabled = true;
        stopBtn.disabled = false;
        draw();
      } catch (err) {
        alert("マイク開始エラー: " + err.message);
      }
    });

    // 測定中止
    stopBtn.addEventListener('click', () => {
      if (animationId) cancelAnimationFrame(animationId);
      if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
      if (audioCtx) audioCtx.close();

      startBtn.disabled = false;
      stopBtn.disabled = true;
      meter.innerText = "0.0 mV";
    });

    function draw() {
      animationId = requestAnimationFrame(draw);
      const dataArray = new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteTimeDomainData(dataArray);

      let maxVal = 0, minVal = 255;
      for (let i = 0; i < dataArray.length; i++) {
        if (dataArray[i] > maxVal) maxVal = dataArray[i];
        if (dataArray[i] < minVal) minVal = dataArray[i];
      }

      const amplitude = (maxVal - minVal) / 255.0;
      meter.innerText = `${(amplitude * 1200).toFixed(1)} mV`;

      canvasCtx.fillStyle = '#111';
      canvasCtx.fillRect(0, 0, canvas.width, canvas.height);
      canvasCtx.lineWidth = 2;
      canvasCtx.strokeStyle = '#00f0ff';
      canvasCtx.beginPath();
      const sliceWidth = canvas.width / dataArray.length;
      let x = 0;
      for (let i = 0; i < dataArray.length; i++) {
        const v = dataArray[i] / 128.0;
        const y = v * canvas.height / 2;
        if (i === 0) canvasCtx.moveTo(x, y);
        else canvasCtx.lineTo(x, y);
        x += sliceWidth;
      }
      canvasCtx.stroke();
    }
  </script>
</body>
</html>
