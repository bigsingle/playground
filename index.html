<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>周波数ジェネレーター</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #000000;
      color: #e0e6ed;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: #080b10;
      border: 1px solid #1a222d;
      border-radius: 16px;
      padding: 20px 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
    }

    /* タイトル */
    .app-title {
      text-align: center;
      font-size: 26px;
      font-weight: bold;
      color: #ffffff;
      margin-bottom: 20px;
      letter-spacing: 2px;
    }

    /* 波形 & チャンネル選択エリア */
    .top-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .waveform-selector {
      display: flex;
      gap: 8px;
    }

    .wave-btn {
      width: 42px;
      height: 42px;
      background: #0d1219;
      border: 1px solid #1e2836;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .wave-btn svg {
      width: 22px;
      height: 22px;
      stroke: #455566;
      fill: none;
      stroke-width: 2;
    }

    .wave-btn.active {
      border-color: #00f0ff;
      background: #081d26;
      box-shadow: 0 0 8px rgba(0, 240, 255, 0.3);
    }

    .wave-btn.active svg {
      stroke: #00f0ff;
    }

    .channel-selector {
      display: flex;
      gap: 4px;
      background: #0d1219;
      padding: 3px;
      border-radius: 8px;
      border: 1px solid #1e2836;
    }

    .ch-btn {
      background: transparent;
      border: none;
      color: #627284;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .ch-btn.active {
      background: #14222e;
      color: #00f0ff;
      text-shadow: 0 0 5px rgba(0, 240, 255, 0.5);
    }

    /* 周波数表示 & 各桁 +/- ボタンエリア */
    .digit-control-section {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .freq-box-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 各桁の矢印行（ボタンを大きく調整） */
    .arrows-row {
      display: flex;
      justify-content: flex-end;
      width: 100%;
      padding-right: 32px; /* Hzラベル分の位置調整 */
      gap: 2px;
      margin: 2px 0;
    }

    .arrow-btn {
      width: 28px;
      height: 32px; /* 高さ拡大 */
      background: rgba(0, 240, 255, 0.05);
      border: 1px solid rgba(0, 240, 255, 0.15);
      border-radius: 4px;
      color: #00f0ff;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.15s;
    }

    .arrow-btn:hover {
      background: rgba(0, 240, 255, 0.2);
      border-color: #00f0ff;
      box-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
    }

    .arrow-btn:active {
      transform: scale(0.9);
      background: #00f0ff;
      color: #000000;
    }

    .arrow-btn svg {
      width: 20px; /* 矢印の表示サイズ拡大 */
      height: 20px;
      fill: currentColor;
    }

    /* メイン周波数ディスプレイ */
    .freq-display-box {
      display: flex;
      align-items: center;
      background: #020304;
      border: 1px solid #00f0ff;
      border-radius: 12px;
      padding: 8px 16px;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
      margin: 4px 0;
    }

    .freq-label {
      font-size: 15px;
      color: #8a99ad;
      margin-right: 12px;
      white-space: nowrap;
    }

    .freq-digits-container {
      display: flex;
      align-items: center;
      font-family: 'Courier New', Courier, monospace;
      font-size: 32px;
      font-weight: bold;
      color: #ffffff;
      letter-spacing: 1px;
    }

    .freq-digit-input {
      background: transparent;
      border: none;
      color: #ffffff;
      font-family: inherit;
      font-size: inherit;
      font-weight: inherit;
      width: 175px;
      text-align: right;
      outline: none;
    }

    .freq-unit {
      color: #00f0ff;
      font-size: 20px;
      margin-left: 8px;
      font-weight: bold;
    }

    /* 再生ボタン */
    .play-btn {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: #0d1219;
      border: 2px solid #00f0ff;
      color: #00f0ff;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.3);
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .play-btn:active {
      transform: scale(0.95);
    }

    .play-btn.playing {
      background: #00f0ff;
      color: #080b10;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.7);
    }

    .play-btn svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }

    /* スライダーセクション */
    .sliders-section {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 20px;
    }

    .slider-group {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .slider-title {
      font-size: 12px;
      color: #8a99ad;
      margin-bottom: 6px;
    }

    .slider-wrapper {
      width: 100%;
      position: relative;
    }

    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      background: transparent;
    }

    input[type=range]:focus {
      outline: none;
    }

    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 4px;
      cursor: pointer;
      background: #18202a;
      border-radius: 2px;
    }

    input[type=range]::-webkit-slider-thumb {
      height: 18px;
      width: 18px;
      border-radius: 50%;
      background: #00f0ff;
      cursor: pointer;
      -webkit-appearance: none;
      margin-top: -7px;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.9);
    }

    .slider-labels {
      display: flex;
      justify-content: space-between;
      width: 100%;
      font-size: 11px;
      color: #00f0ff;
      margin-top: 4px;
    }

    /* オシロスコープ (Canvas) */
    .scope-container {
      position: relative;
      background: #030507;
      border: 1px solid #131b24;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    canvas {
      display: block;
      width: 100%;
      height: 140px;
    }

    .scope-info {
      position: absolute;
      top: 6px;
      left: 10px;
      font-size: 11px;
      color: #ff4a4a;
      font-family: monospace;
      pointer-events: none;
    }

    /* 時間軸設定 */
    .div-controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .div-label {
      font-size: 12px;
      color: #8a99ad;
    }

    .time-btn-group {
      display: flex;
      background: #090d12;
      border: 1px solid #00f0ff44;
      border-radius: 6px;
      padding: 2px;
    }

    .time-btn {
      background: transparent;
      border: none;
      color: #8a99ad;
      padding: 4px 10px;
      font-size: 11px;
      cursor: pointer;
      border-radius: 4px;
    }

    .time-btn.active {
      background: #00f0ff22;
      color: #00f0ff;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- タイトル -->
  <h1 class="app-title">周波数ジェネレーター</h1>

  <!-- 波形選択 & チャンネル選択 -->
  <div class="top-controls">
    <div class="waveform-selector">
      <button class="wave-btn active" data-wave="sine" title="サイン波">
        <svg viewBox="0 0 24 24"><path d="M2 12 Q 6 4, 10 12 T 18 12 T 22 12"/></svg>
      </button>
      <button class="wave-btn" data-wave="square" title="矩形波">
        <svg viewBox="0 0 24 24"><path d="M2 17 V 7 H 12 V 17 H 22"/></svg>
      </button>
      <button class="wave-btn" data-wave="triangle" title="三角波">
        <svg viewBox="0 0 24 24"><path d="M2 17 L 7 7 L 17 17 L 22 7"/></svg>
      </button>
      <button class="wave-btn" data-wave="sawtooth" title="ノコギリ波">
        <svg viewBox="0 0 24 24"><path d="M2 17 L 12 7 V 17 L 22 7"/></svg>
      </button>
    </div>

    <div class="channel-selector">
      <button class="ch-btn active" data-ch="LR">L+R</button>
      <button class="ch-btn" data-ch="L">L</button>
      <button class="ch-btn" data-ch="R">R</button>
    </div>
  </div>

  <!-- 周波数各桁 +/- & メインディスプレイ & 再生ボタン -->
  <div class="digit-control-section">
    <div class="freq-box-wrapper">
      <!-- 上矢印 (加算) -->
      <div class="arrows-row">
        <button class="arrow-btn" data-step="10000" title="+10000Hz"><svg viewBox="0 0 24 24"><path d="M12 7l-7 7h14z"/></svg></button>
        <button class="arrow-btn" data-step="1000" title="+1000Hz"><svg viewBox="0 0 24 24"><path d="M12 7l-7 7h14z"/></svg></button>
        <button class="arrow-btn" data-step="100" title="+100Hz"><svg viewBox="0 0 24 24"><path d="M12 7l-7 7h14z"/></svg></button>
        <button class="arrow-btn" data-step="10" title="+10Hz"><svg viewBox="0 0 24 24"><path d="M12 7l-7 7h14z"/></svg></button>
        <button class="arrow-btn" data-step="1" title="+1Hz"><svg viewBox="0 0 24 24"><path d="M12 7l-7 7h14z"/></svg></button>
        <div style="width: 14px;"></div>
        <button class="arrow-btn" data-step="0.1" title="+0.1Hz"><svg viewBox="0 0 24 24"><path d="M12 7l-7 7h14z"/></svg></button>
      </div>

      <!-- 周波数表示 -->
      <div class="freq-display-box">
        <span class="freq-label">周波数</span>
        <div class="freq-digits-container">
          <input type="number" id="freqInput" class="freq-digit-input" value="10000.0" step="0.1" min="1" max="20000">
        </div>
        <span class="freq-unit">Hz</span>
      </div>

      <!-- 下矢印 (減算) -->
      <div class="arrows-row">
        <button class="arrow-btn" data-step="-10000" title="-10000Hz"><svg viewBox="0 0 24 24"><path d="M12 17l7-7H5z"/></svg></button>
        <button class="arrow-btn" data-step="-1000" title="-1000Hz"><svg viewBox="0 0 24 24"><path d="M12 17l7-7H5z"/></svg></button>
        <button class="arrow-btn" data-step="-100" title="-100Hz"><svg viewBox="0 0 24 24"><path d="M12 17l7-7H5z"/></svg></button>
        <button class="arrow-btn" data-step="-10" title="-10Hz"><svg viewBox="0 0 24 24"><path d="M12 17l7-7H5z"/></svg></button>
        <button class="arrow-btn" data-step="-1" title="-1Hz"><svg viewBox="0 0 24 24"><path d="M12 17l7-7H5z"/></svg></button>
        <div style="width: 14px;"></div>
        <button class="arrow-btn" data-step="-0.1" title="-0.1Hz"><svg viewBox="0 0 24 24"><path d="M12 17l7-7H5z"/></svg></button>
      </div>
    </div>

    <!-- 再生ボタン -->
    <button id="playBtn" class="play-btn" title="再生/停止">
      <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <svg id="pauseIcon" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
    </button>
  </div>

  <!-- スライダーエリア -->
  <div class="sliders-section">
    <!-- 周波数設定スライダー -->
    <div class="slider-group">
      <div class="slider-title">周波数設定</div>
      <div class="slider-wrapper">
        <input type="range" id="freqSlider" min="0" max="1" step="0.0001" value="0.822">
        <div class="slider-labels">
          <span>20 Hz</span>
          <span>20000 Hz</span>
        </div>
      </div>
    </div>

    <!-- システム音量スライダー -->
    <div class="slider-group">
      <div class="slider-title">システム音量</div>
      <div class="slider-wrapper">
        <input type="range" id="volSlider" min="0" max="1" step="0.01" value="0.3">
      </div>
    </div>
  </div>

  <!-- オシロスコープ Canvas -->
  <div class="scope-container">
    <div class="scope-info" id="scopeInfo">T = 1/f = --ms, f = --Hz</div>
    <canvas id="scopeCanvas"></canvas>
  </div>

  <!-- 時間軸 (Time/DIV) -->
  <div class="div-controls">
    <span class="div-label">時間/DIV</span>
    <div class="time-btn-group">
      <button class="time-btn" data-time="0.0005">500µs</button>
      <button class="time-btn active" data-time="0.001">1ms</button>
      <button class="time-btn" data-time="0.002">2ms</button>
      <button class="time-btn" data-time="auto">AUTO</button>
    </div>
  </div>
</div>

<script>
  // Web Audio Context & Nodes
  let audioCtx = null;
  let oscillator = null;
  let gainNode = null;
  let mergerNode = null;
  let analyserNode = null;

  // App State
  let isPlaying = false;
  let currentFreq = 10000;
  let currentWave = 'sine';
  let currentChannel = 'LR';
  let currentVolume = 0.3;
  let timePerDiv = 0.001;
  let autoTimeDiv = true;

  // DOM Elements
  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');
  const pauseIcon = document.getElementById('pauseIcon');
  const freqInput = document.getElementById('freqInput');
  const freqSlider = document.getElementById('freqSlider');
  const volSlider = document.getElementById('volSlider');
  const scopeCanvas = document.getElementById('scopeCanvas');
  const canvasCtx = scopeCanvas.getContext('2d');
  const scopeInfo = document.getElementById('scopeInfo');

  // 対数スライダー変換 (20Hz - 20000Hz)
  const MIN_FREQ = 20;
  const MAX_FREQ = 20000;
  const logMin = Math.log(MIN_FREQ);
  const logMax = Math.log(MAX_FREQ);

  function freqToSlider(f) {
    const clamped = Math.max(MIN_FREQ, Math.min(MAX_FREQ, f));
    return (Math.log(clamped) - logMin) / (logMax - logMin);
  }

  function sliderToFreq(val) {
    return Math.exp(logMin + val * (logMax - logMin));
  }

  // Audio 初期化
  function initAudio() {
    if (audioCtx) return;

    const AudioContext = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AudioContext();

    oscillator = audioCtx.createOscillator();
    gainNode = audioCtx.createGain();
    analyserNode = audioCtx.createAnalyser();
    mergerNode = audioCtx.createChannelMerger(2);

    analyserNode.fftSize = 2048;

    oscillator.type = currentWave;
    oscillator.frequency.setValueAtTime(currentFreq, audioCtx.currentTime);
    gainNode.gain.setValueAtTime(0, audioCtx.currentTime);

    oscillator.connect(gainNode);
    gainNode.connect(analyserNode);

    updateChannelRouting();
    oscillator.start();
  }

  function updateChannelRouting() {
    if (!audioCtx) return;
    analyserNode.disconnect();
    mergerNode.disconnect();

    if (currentChannel === 'LR') {
      analyserNode.connect(audioCtx.destination);
    } else if (currentChannel === 'L') {
      analyserNode.connect(mergerNode, 0, 0);
      mergerNode.connect(audioCtx.destination);
    } else if (currentChannel === 'R') {
      analyserNode.connect(mergerNode, 0, 1);
      mergerNode.connect(audioCtx.destination);
    }
  }

  // 周波数更新
  function setFrequency(freq, updateSlider = true, updateInput = true) {
    currentFreq = Math.max(0.1, Math.min(20000, freq));
    if (oscillator && audioCtx) {
      oscillator.frequency.setValueAtTime(currentFreq, audioCtx.currentTime);
    }
    if (updateInput) {
      freqInput.value = currentFreq.toFixed(1);
    }
    if (updateSlider) {
      freqSlider.value = freqToSlider(currentFreq);
    }
  }

  // 再生/停止 トグル
  playBtn.addEventListener('click', () => {
    initAudio();
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }

    isPlaying = !isPlaying;
    if (isPlaying) {
      gainNode.gain.setTargetAtTime(currentVolume, audioCtx.currentTime, 0.01);
      playBtn.classList.add('playing');
      playIcon.style.display = 'none';
      pauseIcon.style.display = 'block';
    } else {
      gainNode.gain.setTargetAtTime(0, audioCtx.currentTime, 0.01);
      playBtn.classList.remove('playing');
      playIcon.style.display = 'block';
      pauseIcon.style.display = 'none';
    }
  });

  // 波形切り替え
  document.querySelectorAll('.wave-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.wave-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentWave = btn.dataset.wave;
      if (oscillator) oscillator.type = currentWave;
    });
  });

  // チャンネル切り替え
  document.querySelectorAll('.ch-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.ch-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentChannel = btn.dataset.ch;
      updateChannelRouting();
    });
  });

  // 各桁 +/- (▲/▼) ボタンイベント
  document.querySelectorAll('.arrow-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const step = parseFloat(btn.dataset.step);
      setFrequency(Math.round((currentFreq + step) * 10) / 10);
    });
  });

  // スライダー＆数値入力連動
  freqSlider.addEventListener('input', (e) => {
    setFrequency(sliderToFreq(parseFloat(e.target.value)), false, true);
  });

  freqInput.addEventListener('change', (e) => {
    const val = parseFloat(e.target.value);
    if (!isNaN(val)) setFrequency(val, true, false);
  });

  // 時間軸ボタン
  document.querySelectorAll('.time-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      if (btn.dataset.time === 'auto') {
        autoTimeDiv = true;
      } else {
        autoTimeDiv = false;
        timePerDiv = parseFloat(btn.dataset.time);
      }
    });
  });

  // 音量スライダー
  volSlider.addEventListener('input', (e) => {
    currentVolume = parseFloat(e.target.value);
    if (gainNode && isPlaying) {
      gainNode.gain.setValueAtTime(currentVolume, audioCtx.currentTime);
    }
  });

  // -------------------------------------------------------------
  // Canvas オシロスコープ描画 (ゼロクロス・トリガー検知付き)
  // -------------------------------------------------------------
  function resizeCanvas() {
    scopeCanvas.width = scopeCanvas.clientWidth;
    scopeCanvas.height = scopeCanvas.clientHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  function drawScope() {
    requestAnimationFrame(drawScope);

    const width = scopeCanvas.width;
    const height = scopeCanvas.height;

    // 背景描画
    canvasCtx.fillStyle = '#030507';
    canvasCtx.fillRect(0, 0, width, height);

    // グリッド線
    canvasCtx.strokeStyle = '#0f1722';
    canvasCtx.lineWidth = 1;

    const gridX = 10;
    const gridY = 4;
    for (let i = 1; i < gridX; i++) {
      const x = (width / gridX) * i;
      canvasCtx.beginPath();
      canvasCtx.moveTo(x, 0);
      canvasCtx.lineTo(x, height);
      canvasCtx.stroke();
    }
    for (let j = 1; j < gridY; j++) {
      const y = (height / gridY) * j;
      canvasCtx.beginPath();
      canvasCtx.moveTo(0, y);
      canvasCtx.lineTo(width, y);
      canvasCtx.stroke();
    }

    // 周期計算表示 (T = 1/f)
    const periodMs = (1 / currentFreq) * 1000;
    let pStr = periodMs < 1 ? `${(periodMs * 1000).toFixed(2)}µs` : `${periodMs.toFixed(2)}ms`;
    let fStr = currentFreq >= 1000 ? `${(currentFreq / 1000).toFixed(2)}kHz` : `${currentFreq.toFixed(1)}Hz`;
    scopeInfo.innerText = `T = 1/f = ${pStr}, f = ${fStr}`;

    // 波形描画
    if (analyserNode && isPlaying) {
      const bufferLength = analyserNode.fftSize;
      const dataArray = new Uint8Array(bufferLength);
      analyserNode.getByteTimeDomainData(dataArray);

      // 【ゼロクロス・トリガー検知】
      let triggerOffset = 0;
      for (let i = 0; i < bufferLength / 2; i++) {
        if (dataArray[i] < 128 && dataArray[i + 1] >= 128) {
          triggerOffset = i;
          break;
        }
      }

      // 時間軸スケール計算
      if (autoTimeDiv) {
        timePerDiv = Math.max(0.00005, (2.5 / currentFreq) / 10);
      }

      const sampleRate = audioCtx.sampleRate;
      const totalDisplayTime = timePerDiv * 10;
      const samplesToDisplay = totalDisplayTime * sampleRate;
      const sampleStep = samplesToDisplay / width;

      canvasCtx.strokeStyle = '#00f0ff';
      canvasCtx.lineWidth = 2;
      canvasCtx.beginPath();

      for (let x = 0; x < width; x++) {
        const sampleIndex = triggerOffset + Math.floor(x * sampleStep);
        if (sampleIndex >= bufferLength) break;

        const v = dataArray[sampleIndex] / 128.0;
        const y = (v * height) / 2;

        if (x === 0) {
          canvasCtx.moveTo(x, y);
        } else {
          canvasCtx.lineTo(x, y);
        }
      }
      canvasCtx.stroke();
    } else {
      // 停止中は中央直線
      canvasCtx.strokeStyle = '#00f0ff44';
      canvasCtx.lineWidth = 1;
      canvasCtx.beginPath();
      canvasCtx.moveTo(0, height / 2);
      canvasCtx.lineTo(width, height / 2);
      canvasCtx.stroke();
    }
  }

  // 初期値設定
  setFrequency(10000);
  drawScope();
</script>
</body>
</html>
