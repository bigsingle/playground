<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Web Oscilloscope</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background-color: #444444;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    /* メインコンテナ（横長オシロスコープ筐体） */
    .oscillo-container {
      position: relative;
      width: 96vw;
      max-width: 900px;
      height: 80vh;
      max-height: 500px;
      background-color: #1a1a16;
      border: 3px solid #333;
      border-radius: 6px;
      display: flex;
      box-shadow: 0 10px 25px rgba(0,0,0,0.7);
    }

    /* 画面エリア（ディスプレイ） */
    .screen-area {
      position: relative;
      flex: 1;
      height: 100%;
      background-color: #151611;
      overflow: hidden;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* 左上・左下のOSDテキスト表示 */
    .osd {
      position: absolute;
      color: #33ffff;
      font-family: monospace;
      font-size: 14px;
      line-height: 1.3;
      pointer-events: none;
    }
    .osd-top-left { top: 12px; left: 16px; }
    .osd-top-right { top: 12px; right: 16px; text-align: right; }
    .osd-bottom-left { bottom: 12px; left: 16px; }

    /* 右側操作パネル */
    .control-panel {
      width: 120px;
      background-color: #333333;
      border-left: 1px solid #222;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 5px;
      color: #ffffff;
      font-size: 12px;
    }

    .panel-title { font-weight: bold; margin-bottom: 15px; color: #ddd; }
    .panel-btn {
      width: 85%;
      padding: 8px 0;
      margin-bottom: 12px;
      background-color: #444;
      color: #fff;
      border: 1px solid #666;
      border-radius: 4px;
      font-weight: bold;
      text-align: center;
      cursor: pointer;
    }
    .panel-btn:active { background-color: #666; }

    .panel-group {
      width: 100%;
      text-align: center;
      margin-top: auto;
      margin-bottom: 10px;
    }

    .label-sm { font-size: 11px; color: #ccc; margin-bottom: 4px; }
    
    /* 周波数表示表示ボックス */
    .freq-box {
      background-color: #111;
      border: 1px solid #444;
      border-radius: 4px;
      padding: 6px 0;
      color: #00ff00;
      font-family: monospace;
      font-size: 18px;
      font-weight: bold;
      text-align: center;
      margin-top: 2px;
    }
  </style>
</head>
<body>

<div class="oscillo-container">
  <!-- ディスプレイ部 -->
  <div class="screen-area">
    <canvas id="oscilloCanvas"></canvas>
    
    <!-- OSD (On Screen Display) -->
    <div class="osd osd-top-left">
      <div id="timeDiv">2.0 ms/div</div>
      <div id="voltDiv">200 mV/div</div>
    </div>
    <div class="osd osd-top-right">
      <div>Single</div>
      <div style="color: #33ffff;">サイン波</div>
    </div>
    <div class="osd osd-bottom-left">
      <div>0.0 ms</div>
    </div>
  </div>

  <!-- 右側 コントロールパネル -->
  <div class="control-panel">
    <div class="panel-title">FFT / オシロ</div>
    
    <div class="panel-btn" id="btnMode">Mode</div>
    <div class="panel-btn" id="btnReset">Reset</div>
    <div class="panel-btn" id="btnStart">ON / OFF</div>
    
    <div class="panel-group">
      <div class="label-sm">信号種別</div>
      <div class="label-sm" style="color: #33ffff;">周波数</div>
      <div class="freq-box" id="freqVal">0</div>
    </div>

    <div class="panel-btn" id="btnCopy" style="margin-bottom:0;">Copy</div>
  </div>
</div>

<script>
  const canvas = document.getElementById('oscilloCanvas');
  const ctx = canvas.getContext('2d');
  const freqValEl = document.getElementById('freqVal');
  const btnStart = document.getElementById('btnStart');

  let audioCtx = null;
  let analyser = null;
  let dataArray = null;
  let isRunning = false;

  // キャンバス解像度の調整
  function resizeCanvas() {
    canvas.width = canvas.clientWidth;
    canvas.height = canvas.clientHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  // マイク入力の開始・停止
  btnStart.addEventListener('click', async () => {
    if (isRunning) {
      isRunning = false;
      if (audioCtx) audioCtx.suspend();
      return;
    }

    if (!audioCtx) {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: false
          }
        });
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioCtx.createMediaStreamSource(stream);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 2048;
        source.connect(analyser);

        dataArray = new Uint8Array(analyser.frequencyBinCount);
        isRunning = true;
        draw();
      } catch (err) {
        alert("マイクアクセスの許可が必要です: " + err);
      }
    } else {
      audioCtx.resume();
      isRunning = true;
      draw();
    }
  });

  // 簡易周波数推定（自己相関/ゼロクロス方式）
  function estimateFrequency(buffer, sampleRate) {
    let zeroCrossings = 0;
    for (let i = 0; i < buffer.length - 1; i++) {
      if ((buffer[i] < 128 && buffer[i+1] >= 128) || (buffer[i] >= 128 && buffer[i+1] < 128)) {
        zeroCrossings++;
      }
    }
    const numCycles = zeroCrossings / 2;
    const duration = buffer.length / sampleRate;
    return Math.round(numCycles / duration);
  }

  // 描画ループ
  function draw() {
    if (!isRunning) return;
    requestAnimationFrame(draw);

    analyser.getByteTimeDomainData(dataArray);

    const w = canvas.width;
    const h = canvas.height;

    // 背景クリア
    ctx.fillStyle = '#151611';
    ctx.fillRect(0, 0, w, h);

    // グリッド線の描画 (8行 x 10列)
    ctx.strokeStyle = '#2d3326';
    ctx.lineWidth = 1;

    const cols = 10;
    const rows = 8;
    for (let i = 1; i < cols; i++) {
      const x = (w / cols) * i;
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, h);
      ctx.stroke();
    }
    for (let j = 1; j < rows; j++) {
      const y = (h / rows) * j;
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(w, y);
      ctx.stroke();
    }

    // センター十字目盛り（細かな目盛り線）
    ctx.strokeStyle = '#3d4734';
    const centerX = w / 2;
    const centerY = h / 2;
    
    // センター縦線
    ctx.beginPath(); ctx.moveTo(centerX, 0); ctx.lineTo(centerX, h); ctx.stroke();
    // センター横線
    ctx.beginPath(); ctx.moveTo(0, centerY); ctx.lineTo(w, centerY); ctx.stroke();

    // 波形描画 (黄色/黄緑色のレトロスタイル波形)
    ctx.lineWidth = 1.8;
    ctx.strokeStyle = '#d4df38';
    ctx.beginPath();

    const sliceWidth = w * 1.0 / dataArray.length;
    let x = 0;

    for (let i = 0; i < dataArray.length; i++) {
      const v = dataArray[i] / 128.0; // 0.0 - 2.0 (1.0中心)
      const y = (v * h) / 2;

      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);

      x += sliceWidth;
    }
    ctx.stroke();

    // 簡易周波数更新
    if (audioCtx) {
      const freq = estimateFrequency(dataArray, audioCtx.sampleRate);
      if (freq > 30 && freq < 5000) {
        freqValEl.textContent = freq;
      }
    }
  }
</script>
</body>
</html>
